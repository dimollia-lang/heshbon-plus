<style>
  :root {
    --bg: #f2f5fa;
    --card: #ffffff;
    --text: #1a2333;
    --muted: #64748b;
    --accent: #1a56db;
    --accent-soft: #e8effc;
    --green: #0e9f6e;
    --green-soft: #e6f6f0;
    --red: #d94b4b;
    --amber: #b45309;
    --amber-soft: #fdf3e3;
    --border: #e2e8f0;
    --shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
    --radius: 14px;
  }
  /* Тема: системная — через media; ручной выбор — data-theme на <html> перекрывает */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e131d;
      --card: #171f2e;
      --text: #e6ecf5;
      --muted: #8b98ab;
      --accent: #6c9bff;
      --accent-soft: #1b2a4a;
      --green: #34d399;
      --green-soft: #10302a;
      --red: #f87171;
      --amber: #fbbf24;
      --amber-soft: #33281180;
      --border: #263143;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e131d;
    --card: #171f2e;
    --text: #e6ecf5;
    --muted: #8b98ab;
    --accent: #6c9bff;
    --accent-soft: #1b2a4a;
    --green: #34d399;
    --green-soft: #10302a;
    --red: #f87171;
    --amber: #fbbf24;
    --amber-soft: #33281180;
    --border: #263143;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body { overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .app {
    max-width: 480px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--bg);
    padding-bottom: 76px;
  }
  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 14px 10px;
    display: flex; align-items: center; gap: 7px;
  }
  /* В APK (file://) WebView на Android 15 рисует под статус-баром:
     опускаем шапку ниже часов/батареи — env() плюс гарантированный минимум */
  body.native header.topbar { padding-top: calc(14px + max(env(safe-area-inset-top, 0px), 34px)); }
  body.native { --native-top: 1; }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #7c3aed);
    color: #fff; font-weight: 800; font-size: 19px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
  .topbar .sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  /* v1.18 (фидбек 10.08): вся шапка в ОДНУ строку — размеры ужаты, языки снова справа.
     На узких экранах у кнопки подписки остаётся только звёздочка (текст прячется). */
  .topbar .tt { flex: 1 1 80px; min-width: 80px; }
  .topbar .tt h1, .topbar .tt .sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .gear-btn, .topbar .logo, .topbar .star-btn, .topbar .langs { flex: 0 0 auto; }
  .langs { margin-inline-start: auto; display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
  .langs button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700; padding: 6px 7px; border-radius: 999px; letter-spacing: .2px;
    min-width: 32px; min-height: 32px; /* палец должен попадать */
  }
  .langs button.on { background: var(--accent); color: #fff; }
  main { flex: 1; padding: 16px 14px 24px; }
  .page { display: none; }
  .page.active { display: block; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform:none;} }

  .page-title { font-size: 20px; font-weight: 800; letter-spacing: -.3px; margin: 4px 2px 2px; }
  .page-desc { font-size: 13px; color: var(--muted); margin: 0 2px 14px; line-height: 1.45; }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--border);
    padding: 16px; margin-bottom: 14px;
  }
  .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; display:flex; align-items:center; gap:7px; flex-wrap: wrap; }
  .card .hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 12px; }
  /* Сворачиваемые карточки (v1.15.1): второстепенные закрыты по умолчанию — интерфейс не перегружен.
     Клик по заголовку открывает; выбор запоминается (heshbon_folds). */
  .card.foldable > h3 { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .card.foldable > h3::after { content: '▾'; margin-inline-start: auto; color: var(--muted); font-size: 13px; transition: transform .15s; }
  .card.foldable.folded > h3::after { transform: rotate(-90deg); }
  [dir=rtl] .card.foldable.folded > h3::after { transform: rotate(90deg); }
  .card.folded > *:not(h3) { display: none !important; }
  .card.folded { padding-top: 13px; padding-bottom: 13px; }
  .card.folded > h3 { margin-bottom: 0; }

  label.fld { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 5px; }
  input[type=number], input[type=text], input[type=month], select, textarea {
    width: 100%; padding: 11px 12px; font-size: 16px;
    border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); outline: none;
    transition: border-color .15s;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  /* v1.16.1 (фидбек 09.08, скрин): подписи в рядах бывают разной высоты — колонку делаем
     flex-столбцом, подпись растягиваем, контролы прижимаются к низу и стоят в одну линию */
  .row2 > div, .row3 > div { display: flex; flex-direction: column; }
  .row2 > div > .fld, .row3 > div > .fld { flex: 1 0 auto; }

  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; border: 1px solid var(--border); }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    font-size: 12px; font-weight: 600; padding: 8px 2px; border-radius: 8px;
    cursor: pointer; font-family: inherit; line-height: 1.25;
  }
  .seg button.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px rgba(15,23,42,.12); }
  .seg .subdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-inline-start: 6px; vertical-align: middle; }

  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .result-hero {
    margin-top: 14px; padding: 14px 16px; border-radius: 12px;
    background: var(--green-soft); border: 1px solid color-mix(in srgb, var(--green) 30%, transparent);
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .result-hero .lbl { font-size: 13px; font-weight: 700; color: var(--green); }
  .result-hero .val { font-size: 26px; font-weight: 800; color: var(--green); letter-spacing: -.5px; }
  .breakdown { margin-top: 10px; }
  .b-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; font-size: 13.5px; border-bottom: 1px dashed var(--border); }
  .b-row:last-child { border-bottom: 0; }
  .b-row .n { color: var(--muted); }
  .b-row .v { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; unicode-bidi: isolate; }
  .result-hero .val, .deadline .day { direction: ltr; unicode-bidi: isolate; }
  .b-row .v.neg { color: var(--red); }
  .b-row .v.pos { color: var(--green); }
  .ct-pg { display: inline-flex; align-items: center; gap: 7px; margin: 4px 6px 2px 0; padding: 5px 9px; border: 1px solid var(--border); border-radius: 10px; font-size: 12.5px; cursor: pointer; vertical-align: top; }
  .ct-pg img { height: 46px; border-radius: 6px; display: block; }
  .ct-pg .x { color: var(--red); font-weight: 700; }

  details.exp { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  details.exp summary { font-size: 13px; font-weight: 600; color: var(--accent); cursor: pointer; padding: 4px 0; list-style: none; }
  details.exp summary::before { content: "▸ "; }
  details.exp[open] summary::before { content: "▾ "; }

  .note {
    font-size: 11.5px; color: var(--muted); line-height: 1.5;
    background: var(--bg); border-radius: 9px; padding: 9px 11px; margin-top: 10px;
  }
  .note b { color: var(--text); }
  .note.warn { background: var(--amber-soft); color: var(--amber); }

  .acc { border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px; overflow: hidden; background: var(--card); }
  .acc summary {
    padding: 12px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
    list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .acc summary::-webkit-details-marker { display: none; }
  .acc summary::after { content: "+"; font-size: 18px; color: var(--muted); font-weight: 400; }
  .acc[open] summary::after { content: "–"; }
  .acc .body { padding: 0 14px 13px; font-size: 13.5px; line-height: 1.55; color: var(--text); }
  /* сравнительная таблица «закон vs цав архава» внутри аккордеонов и справок */
  .cmp { width: 100%; border-collapse: collapse; margin: 8px 0 10px; font-size: 12px; direction: ltr; unicode-bidi: isolate; table-layout: fixed; }
  .cmp th, .cmp td { border-bottom: 1px solid var(--border); padding: 6px 4px; text-align: start; vertical-align: top; overflow-wrap: break-word; hyphens: manual; }
  .cmp th { font-weight: 700; color: var(--muted); font-size: 11px; }
  .cmp td:not(:first-child), .cmp th:not(:first-child) { text-align: center; }
  .cmp th:first-child, .cmp td:first-child { width: 24%; }
  .cmp td:last-child { font-size: 11.5px; color: var(--muted); }
  .cmp td.hi { color: var(--green); font-weight: 700; }
  .cmp tr:last-child td { border-bottom: none; }
  [dir="rtl"] .cmp { direction: rtl; }
  .acc .body p { margin-bottom: 8px; }
  .acc .body ul { padding-inline-start: 18px; margin-bottom: 8px; }
  .acc .body li { margin-bottom: 4px; }

  table.rates { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.rates th { text-align: start; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.rates td { padding: 7px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.rates tr:last-child td { border-bottom: 0; }
  table.rates td.r, table.rates th.r { text-align: end; }

  .pill { display:inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }

  .deadline { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px dashed var(--border); }
  .deadline:last-child { border-bottom: 0; }
  .deadline .day {
    min-width: 44px; text-align: center; background: var(--accent-soft); color: var(--accent);
    border-radius: 9px; padding: 5px 4px; font-weight: 800; font-size: 15px; line-height: 1.1;
  }
  .deadline .day small { display: block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .deadline .info { font-size: 13px; line-height: 1.4; }
  .deadline .info b { display: block; font-size: 13.5px; }
  .deadline .info span { color: var(--muted); font-size: 12px; }

  .btn {
    display: block; width: 100%; padding: 13px; margin-top: 12px;
    background: var(--accent); color: #fff; border: 0; border-radius: 11px;
    font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); }

  .ai-chip { display: inline-block; margin: 3px 4px 3px 0; padding: 7px 11px; font-size: 12.5px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; color: var(--text); cursor: pointer; }
  .ai-answer { margin-top: 10px; font-size: 13px; background: var(--accent-soft); border-radius: 10px; padding: 11px 13px; line-height: 1.55; display: none; }
  .ai-ask { display: flex; gap: 8px; margin-top: 10px; }
  .ai-ask .ai-clear { flex: 0 0 auto; width: 40px; border: 1.5px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 10px; font-size: 14px; cursor: pointer; }
  /* v1.16: брутто выделено как нетто, только красным — «от него идёт расчёт» (фидбек 09.08) */
  /* v1.17: брутто в том же «герое», что и нетто, но красным — подпись слева, сумма справа.
     Поле остаётся вводимым: input внутри .val, без рамки, ширина по содержимому. */
  .result-hero.gross { background: color-mix(in srgb, var(--red) 9%, transparent); border-color: color-mix(in srgb, var(--red) 30%, transparent); margin-top: 4px; flex-wrap: nowrap; }
  .result-hero.gross .lbl { flex: 1 1 auto; }
  .result-hero.gross .lbl, .result-hero.gross .val { color: var(--red); }
  .result-hero.gross .val { display: inline-flex; align-items: baseline; gap: 4px; }
  .result-hero.gross .val input {
    width: 6.2ch; padding: 0; border: 0; border-bottom: 2px dashed color-mix(in srgb, var(--red) 45%, transparent);
    border-radius: 0; background: transparent; color: var(--red);
    font: inherit; font-size: 26px; font-weight: 800; letter-spacing: -.5px; text-align: end;
    font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate;
  }
  .result-hero.gross .val input:focus { border-bottom-color: var(--red); outline: none; }
  /* плейсхолдер («сумма») мелким шрифтом — не спорит с крупной цифрой */
  .result-hero.gross .val input::placeholder { font-size: 13px; font-weight: 600; opacity: .55; }
  /* v1.20: календарь праздников — месяцы сеткой, праздничные дни красным */
  .holcal { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin: 10px 0 4px; }
  .hm { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 8px 6px; }
  .hm-t { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .hm-d, .hm-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .hm-d b { font-size: 9px; color: var(--muted); text-align: center; font-weight: 600; }
  .hm-g i { font-style: normal; font-size: 10.5px; text-align: center; padding: 3px 0; border-radius: 5px; color: var(--text); }
  .hm-g i.sb { color: var(--muted); }
  .hm-g i.hd { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); font-weight: 800; }
  .hm-g i.td { outline: 1.5px solid var(--accent); }
  .holcal-lg .hd { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px;
                   background: color-mix(in srgb, var(--red) 16%, transparent); border: 1px solid var(--red); margin-inline-end: 5px; }
  .result-hero.gross .val input::-webkit-outer-spin-button,
  .result-hero.gross .val input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .ai-ask input { flex: 1; }
  .ai-ask button { flex-shrink: 0; padding: 0 16px; background: var(--accent); color: #fff; border: 0; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }

  .q-item { padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .q-item:last-child { border-bottom: 0; }
  .q-item .q-t { font-size: 13.5px; font-weight: 600; margin-bottom: 7px; line-height: 1.4; }
  .q-opts { display: flex; gap: 6px; }
  .q-opts button { flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); background: var(--bg); color: var(--muted); border-radius: 8px; cursor: pointer; font-family: inherit; }
  .q-opts button.sel-yes { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .q-opts button.sel-no { background: color-mix(in srgb, var(--red) 12%, transparent); border-color: var(--red); color: var(--red); }
  .q-opts button.sel-dk { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  .viol { margin-top: 8px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.5; }
  .viol.bad { background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--red) 35%, transparent); }
  .viol.dk { background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); }
  .viol b { display: block; margin-bottom: 3px; }

  .links a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 11px 2px; font-size: 14px; color: var(--text); text-decoration: none; border-bottom: 1px dashed var(--border); }
  .links a:last-child { border-bottom: 0; }
  .links a small { color: var(--muted); font-size: 11.5px; }
  .links a::after { content: "↗"; color: var(--accent); }

  footer.disclaimer { padding: 4px 18px 18px; font-size: 10.5px; color: var(--muted); line-height: 1.55; text-align: center; }

  .ad-card { position: relative; border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, transparent); border-radius: var(--radius); padding: 15px 16px 11px; margin-bottom: 14px; background: color-mix(in srgb, var(--accent-soft) 50%, transparent); }
  .ad-card .ad-badge { position: absolute; top: -8px; inset-inline-end: 12px; font-size: 9.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; background: var(--card); color: var(--muted); border: 1px solid var(--border); padding: 2px 7px; border-radius: 999px; }
  .ad-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .ad-card p { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-bottom: 9px; }
  .ad-card .ad-cta { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--accent); text-decoration: none; padding: 6px 13px; border: 1.5px solid var(--accent); border-radius: 999px; }
  .ad-card .ad-demo { display: inline-block; font-size: 10px; color: var(--muted); margin-inline-start: 8px; }
  .ad-place { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); border-top: 1px dashed var(--border); margin-top: 10px; padding-top: 7px; }
  .ad-place a { color: var(--accent); font-weight: 700; text-decoration: none; white-space: nowrap; }

  .star-btn { border: 0; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; font-size: 11.5px; font-weight: 800; padding: 8px 10px; border-radius: 999px; cursor: pointer; font-family: inherit; white-space: nowrap; min-height: 34px; }
  .gear-btn { border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; min-width: 34px; min-height: 34px; border-radius: 999px; cursor: pointer; font-family: inherit; padding: 0 7px; }
  /* совсем узкие экраны: у кнопки подписки остаётся только звезда — шапка держится в одну строку */
  @media (max-width: 400px) { .star-btn .lbl { display: none; } }
  /* «?» — пояснение по клику, вместо простыни текста */
  .qmark { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--red); color: var(--red); background: transparent; font-size: 12.5px; font-weight: 800; cursor: pointer; flex-shrink: 0; padding: 0; font-family: inherit; vertical-align: middle; margin-inline-start: 6px; }
  .qnote { display: none; }
  .qnote.open { display: block; }
  .langs { margin-inline-start: 8px; }
  .topbar > div:nth-child(2) { margin-inline-end: auto; }

  .modal { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(8,12,20,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
  .modal .sheet { position: relative; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size: 18px; font-weight: 800; }
  .sheet .sub { font-size: 12.5px; color: var(--muted); margin: 3px 0 14px; line-height: 1.45; }
  .plan { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; position: relative; }
  .plan.hot { border-color: var(--accent); box-shadow: 0 4px 18px color-mix(in srgb, var(--accent) 18%, transparent); }
  .plan .hot-badge { position: absolute; top: -9px; inset-inline-start: 14px; font-size: 9.5px; font-weight: 800; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .5px; }
  .plan .p-name { font-weight: 800; font-size: 15px; }
  .plan .p-price { font-weight: 800; font-size: 17px; color: var(--accent); margin: 2px 0 8px; direction: ltr; unicode-bidi: isolate; text-align: start; }
  .plan ul { padding-inline-start: 18px; font-size: 12.5px; line-height: 1.6; margin-bottom: 11px; }
  .plan .btn { margin-top: 0; padding: 11px; font-size: 14px; }

  nav.tabbar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; z-index: 30;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabbar button {
    flex: 1; border: 0; background: transparent; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 2px; border-radius: 12px; color: var(--muted);
  }
  nav.tabbar button .ico { font-size: 21px; line-height: 1; }
  nav.tabbar button .t { font-size: 10.5px; font-weight: 700; letter-spacing: .1px; }
  nav.tabbar button.on { color: var(--accent); background: var(--accent-soft); }
/* Печатный табель: скрыт на экране; при печати виден ТОЛЬКО он (WebView-адаптер применяет print CSS) */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;color:#000;background:#fff;font-size:12px;line-height:1.45}

  #printArea th{background:#eee}
  #printArea .pr-tot{margin:4px 0}
  #printArea .pr-note{font-size:9.5px;color:#333;margin:10px 0}
  #printArea .pr-sig{display:flex;justify-content:space-between;gap:24px;margin-top:26px}

  #printArea .he{unicode-bidi:isolate;direction:rtl}
}

<script src="i18n.js?v=1241"></script><!-- версию бампать при правке словаря: иначе браузер и WebView отдают старый кеш -->
<script>
// В APK страница грузится с file:// — включаем нативные отступы под статус-бар
if (location.protocol === 'file:') document.body.classList.add('native');

// ======= i18n =======
let LANG = localStorage.getItem('heshbon_lang') || 'ru';
if (!I18N[LANG]) LANG = 'ru';
const t = k => (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : (I18N.ru[k] !== undefined ? I18N.ru[k] : k);
const tf = (k, vars) => { let s = t(k); for (const v in vars) s = s.split('{' + v + '}').join(vars[v]); return s; };
// Склонение по числу. В словаре формы через «|»: для 1 | для 2–4 | для 5+.
// Дробные в русском всегда идут в род. п. ед. ч. (2,25 пункта) — это форма №2.
function plural(n, key) {
  const f = t(key).split('|');
  if (LANG !== 'ru') return f[Math.abs(n) === 1 ? 0 : 1] || f[0];
  if (!Number.isInteger(n)) return f[1] || f[0];
  const a = Math.abs(n), d = a % 10, c = a % 100;
  if (d === 1 && c !== 11) return f[0];
  if (d >= 2 && d <= 4 && (c < 12 || c > 14)) return f[1] || f[0];
  return f[2] || f[1] || f[0];
}
const pluralN = (n, key) => n + ' ' + plural(n, key); // «3 пункта», «1 нарушение»
const APP_VERSION = '1.25.0'; // бампать вместе с versionCode в манифесте

function applyI18n() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = t('dir');
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  const ver = document.getElementById('setVersion');
  if (ver) ver.textContent = 'v' + APP_VERSION;
  // тексты подписки собираются в коде (даты, код доступа) — перерисовываем их вслед за языком.
  // На самом раннем вызове модуль подписки ещё не объявлен — это нормально.
  try { subRender(); } catch (e) {}
}
function setLang(l) {
  LANG = l; localStorage.setItem('heshbon_lang', l);
  if (window.HeshbonNative && window.HeshbonNative.setLang) try { window.HeshbonNative.setLang(l); } catch (e) {} // язык пушей
  applyI18n();
  fillAliyahSelects();
  fillVisaSelects();
  document.getElementById('aiAnsEmp').style.display = 'none';
  document.getElementById('ltOut').style.display = 'none'; // письмо рендерится под язык — при смене закрываем
  vatOut.innerHTML = '';
  updateHello();
  refreshAll(true); // true = не трогать ручные некудот
}
// Полный пересчёт: единая цепочка для старта и смены языка.
// Держать ОДИН список — раздельные копии уже давали пустую кнопку пунча при запуске (whCalc/tbRender не входили в init).
function refreshAll(keepPts) {
  updEmpPoints(keepPts); updSelfPoints(keepPts); calcOT(); whCalc(); tbRender(); holRender(); calcSelf(); calcFired(); renderDeadlines(); unUpdate(); showRates();
  incRender(); ekRender(); calcPrice(); calcSelfPens();
  ejRender(); zrRender(); blmRender(); ivcRender();
}
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => setLang(b.dataset.l));

// ======= Константы 2026 (вшитый фолбэк; при старте обновляются из rates.json) =======
let BRACKETS = [ // месячные ступени подоходного налога 2026 (20%/31% расширены законом с 01.2026)
  [7010, .10], [10060, .14], [19000, .20], [25100, .31], [46690, .35], [60130, .47], [Infinity, .50]
];
let POINT = 242;            // некудат зикуй ₪/мес (заморожена 2025–2027)
let NI_T = 7703;            // порог 60% средней з/п (2026)
let NI_CAP = 51910;         // потолок битуах леуми (2026)
let NI_EMP = [.0427, .1217];// работник-резидент: БЛ+бриют, реформа 2025–26
let NI_B1  = [.0004, .0087];// иностранный работник/2(а)5 (без мас бриют; ставки нерезидента)
let NI_SELF = [.0610, .18]; // ацмаи 2026
let PENSION_EMP = .06, PENSION_ER = .065, PITZUIM = .06, NI_ER = [.0451, .076]; // пицуим: мин. 6%, полное 8.33%
// Отраслевые пенсионные ставки по цав архава (сверено 29.07.2026, כל-זכות + workrights):
// клининг — с 01.07.2015 работник 7% / работодатель 7,5% / пицуим 8,33%, с первого дня работы.
// Охрана: источники расходятся (7/7,5/8,33 vs 6/6,5) — НЕ подменяем, показываем общие + подсказку в справочнике.
const SECTOR_PENSION = { cleaning: { emp: .07, er: .075, pitz: .0833 } };
function sectorPension() {
  const ind = document.getElementById('profIndustry') ? document.getElementById('profIndustry').value : '';
  const s = SECTOR_PENSION[ind];
  return s ? { sector: ind, ...s } : { sector: '', emp: PENSION_EMP, er: PENSION_ER, pitz: PITZUIM };
}

const fmt = n => new Intl.NumberFormat(t('locale'), {maximumFractionDigits: 0}).format(Math.round(n)) + ' ₪';

function incomeTax(gross, points) {
  let tax = 0, prev = 0;
  for (const [cap, rate] of BRACKETS) {
    if (gross > prev) tax += (Math.min(gross, cap) - prev) * rate; else break;
    prev = cap;
  }
  return Math.max(0, tax - points * POINT);
}
function natIns(gross, rates) {
  const base = Math.min(gross, NI_CAP);
  return Math.min(base, NI_T) * rates[0] + Math.max(0, base - NI_T) * rates[1];
}

  if (m < 1) return 0;

// сетка детских пунктов «с 2024 года» (кользхут, 28.07.2026) — общая для профилей работника и самозанятого;
// pre = префикс id полей: 'prof' (работник) или 'se' (самозанятый)
// ❗v1.21 (сверено с официальным симулятором рашут а-мисим, gov.il, 10.08.2026): разница
// «2 против 1» за детей 6–17 — это НЕ пол родителя, а ОПЕКА (ילדים שבחזקת ההורה).
// Ребёнок в опеке: 6–17 = 2 балла, год 18-летия = 0,5. Ребёнок не в опеке: 6–17 = 1, 18-летия нет.
// До 6 лет сетка одинаковая для обоих родителей.
function kidsPtsFor(g, pre) {
  const n = id => Math.max(0, +document.getElementById(pre + id).value || 0);
  const el = document.getElementById(pre + 'KidsCustody');
  const custody = !el || el.checked; // по умолчанию дети живут с пользователем
  // v1.21.1 «ниюд некудот» (симулятор рашут а-мисим): в год родов можно отложить ОДИН балл
  // на следующий налоговый год; тогда в следующем году (ребёнку 1) он прибавляется.
  const defer = document.getElementById(pre + 'KidsDefer'), got = document.getElementById(pre + 'KidsDeferGot');
  const shift = (defer && defer.checked && n('KidsB') > 0 ? -1 : 0) + (got && got.checked && n('Kids12') > 0 ? 1 : 0);
  return shift
       + n('KidsB') * 2.5      // год рождения ребёнка
       + n('Kids12') * 4.5     // 1–2 года
       + n('Kids3') * 3.5      // 3 года
       + n('Kids45') * 2.5     // 4–5 лет
       + n('Kids617') * (custody ? 2 : 1)     // 6–17 лет: в опеке 2, вне опеки 1
       + n('Kids18') * (custody ? 0.5 : 0)    // год 18-летия — только за ребёнка в опеке
       + n('KidsDis') * 2;     // ребёнок с инвалидностью: +2 доп. к возрастным (ст. 45; одному из родителей, кользхут 09.08.2026)
}
// v1.15: «другие основания» — чекбоксы с баллами. v1.16 факт-фикс (кользхут 09.08.2026):
// профдиплом (1700+ часов, окончившим с 2023) = 1 балл/год на срок учёбы (макс 3), было 0.5;
// BA и диплом НЕ суммируются (взаимоисключение в обработчике exGrid); MA сочетается с любым.
// Teen: работнику 16–18 лет положен +1 балл; Apart: родитель живёт отдельно, ребёнок в его опеке,
// общего хозяйства нет — +1 (оба правила взяты из официального симулятора рашут а-мисим, 10.08.2026).
// Spouse («йахид мутав»): 1 балл, если детей нет, и 0,5 — если есть (уточняется в exPoints).
const EX_VALS = { Ba: 1, Ma: 0.5, Dip: 1, Alim: 1, Spouse: 1, Single: 1, Teen: 1, Apart: 1 };
// BA ↔ профдиплом: закон разрешает только одну из льгот — включение одной снимает другую
function exExclusive(prefix, changedId) {
  const g = id => document.getElementById(prefix + id);
  if (changedId === prefix + 'ExBa' && g('ExBa').checked) g('ExDip').checked = false;
  if (changedId === prefix + 'ExDip' && g('ExDip').checked) g('ExBa').checked = false;
}
function exPoints(prefix, hasKids) {
  const g = id => document.getElementById(prefix + id);
  let s = 0;
  if (g('ExDem') && g('ExDem').checked) s += (g('ExDemT').value === 'part' ? 1 : 2);
  for (const k in EX_VALS) {
    if (!g('Ex' + k) || !g('Ex' + k).checked) continue;
    // «йахид мутав»: без детей 1 балл, с детьми 0,5 (правило симулятора рашут а-мисим)
    s += (k === 'Spouse' && hasKids) ? 0.5 : EX_VALS[k];
  }
  return s;
}
function exSave(prefix) {
  const g = id => document.getElementById(prefix + id);
  const o = { dem: g('ExDem').checked ? 1 : 0, demT: g('ExDemT').value };
  for (const k in EX_VALS) o[k] = g('Ex' + k).checked ? 1 : 0;
  return o;
}
function exLoad(prefix, o) {
  if (!o) return;
  const g = id => document.getElementById(prefix + id);
  g('ExDem').checked = !!o.dem;
  if (o.demT) g('ExDemT').value = o.demT;
  g('ExDemT').style.display = g('ExDem').checked ? '' : 'none';
  for (const k in EX_VALS) g('Ex' + k).checked = !!o[k];
}

    on,
    kitzba: on && segVal('retKitzba') === 'yes',      // получает кицбат зикна → взносы работника 0
    age: segVal('retAge'),                            // a6267 / a6770 / a70

function empNiRates() { // ставки БЛ+бриют работника с учётом статуса и пенсионерского режима
  const st = segVal('empStatus');
  if (st === 'b1' || st === 's25') return NI_B1;
  const r = retireeState();
  if (r.on) return r.kitzba ? NI_RET_K : NI_RET[r.age] || NI_EMP;
  return NI_EMP;

function erNiRates() { // ставки БЛ работодателя (пониженные за пенсионера)

function calcEmp() {
  const st = segVal('empStatus');
  const gross = +document.getElementById('empGross').value || 0;
  const pts = +document.getElementById('empPoints').value || 0;
  const hasPen = document.getElementById('empPension').checked;

  const foreign = st === 'b1' || st === 's25';
  const hish = document.getElementById('profHish').checked;
  const nn = v => Math.max(0, +v || 0);
  // сверхурочные берутся из карточки «Сверхурочные» ниже: входят в облагаемое брутто,
  // а пенсия и иштальмут по закону считаются только от базовой зарплаты
  const otPay = nn(document.getElementById('otRate').value) *
    (1.25 * nn(document.getElementById('ot125').value) + 1.5 * nn(document.getElementById('ot150').value));
  const taxable = gross + otPay;
  const tax = incomeTax(taxable, pts);
  const ret = retireeState(); // работающий пенсионер: пониженные/нулевые взносы БЛ+бриют
  const ni = natIns(taxable, empNiRates());
  const sp = sectorPension(); // отраслевые ставки (клининг: 7 / 7,5 / 8,33 с первого дня — цав архава, сверено 29.07.2026)
  renderPensionLabels(sp);    // подпись галочки и справка «?» показывают ставки ЭТОЙ отрасли, а не общие 6% / 12,5%
  const pen = hasPen ? gross * sp.emp : 0;
  const hishEmp = hish ? gross * 0.025 : 0;
  const net = taxable - tax - ni - pen - hishEmp;

  document.getElementById('empNet').textContent = fmt(net);
  document.getElementById('empBreak').innerHTML =
    row(t('brk.gross'), fmt(gross)) +
    (otPay > 0 ? row(t('brk.ot'), '+' + fmt(otPay), 'pos') + row(t('brk.taxbase'), fmt(taxable)) : '') +
    row(tf('brk.tax', {pts}), '−' + fmt(tax), 'neg') +
    // у получателя кицбат зикна строка показывается с нулём — это законный ноль, не пропуск
    row(foreign ? t('brk.niForeign') : ret.on ? t(ret.kitzba ? 'brk.ni.kitzba' : 'brk.ni.ret') : t('brk.ni'), '−' + fmt(ni), 'neg') +
    (hasPen ? row(t('brk.pension') + ' ' + pctS(sp.emp), '−' + fmt(pen), 'neg') : '') +
    (hish ? row(t('brk.hish'), '−' + fmt(hishEmp), 'neg') : '');
  document.getElementById('empEmployer').innerHTML =
    row(t('employer.pens') + ' ' + pctS(sp.er), '+' + fmt(gross * sp.er), 'pos') +
    row(t('employer.pitz') + ' ' + pctS(sp.pitz) + (sp.sector ? '' : ' ' + t('employer.pitz.min')), '+' + fmt(gross * sp.pitz), 'pos') +
    (sp.sector ? '<div class="note" style="margin-top:6px">' + t('sector.pens.note.' + sp.sector) + '</div>' : '') +
    (hish ? row(t('employer.hish'), '+' + fmt(gross * 0.075), 'pos') : '') +
    row(t('employer.ni'), '+' + fmt(natIns(taxable, erNiRates())), 'pos') +
    (st === 's25' ? '<div class="note warn" style="margin-top:8px">' + t('employer.s25note') + '</div>' : '');
}

// ======= Калькулятор увольнения (минимум по закону) =======
function noticeDays(months, hourly) {
  if (!hourly) { // месячная оплата
    if (months < 6) return months;                 // 1 день за месяц
    if (months < 12) return 6 + 2.5 * (months - 6);
    return 30;
  }
  if (months < 12) return Math.min(12, months);    // почасовая: 1 день/мес в 1-й год
  if (months < 24) return 14;
  if (months < 36) return 21;
  return 30;
}
function calcFired() {
  const nn = v => Math.max(0, +v || 0);
  const gross = nn(fGross.value), years = nn(fTenure.value);
  const hourly = segVal('fpType') === 'h';
  const nd = noticeDays(years * 12, hourly);
  const pitz = years >= 1 ? gross * years : 0; // пицуим — только после полного года стажа (фидбек 26.07)
  document.getElementById('fPitzNote').style.display = (years > 0 && years < 1) ? '' : 'none';
  const notice = gross * nd / 30;
  const vac = nn(fVac.value) * gross / 21.67;
  // v1.18 (фидбек 10.08): ставка хавраа бралась из отрасли профиля молча — «2 558 ₪ за 5 дней»
  // выглядело ошибкой. Теперь сектор виден в строке: частный 451,5 / охрана и гос. 511,6 / клининг 512,12. Клининг, охрана 511,6.
  const ind = document.getElementById('profIndustry').value;
  const pub = ['cleaning', 'security'].includes(ind);
  const havRate = ind === 'cleaning' ? HAVRAA_CLEAN : (pub ? HAVRAA_PUB : HAVRAA_DAY);
  const hav = nn(fHav.value) * havRate;
  fTotal.textContent = fmt(pitz + notice + vac + hav);
  fBreak.innerHTML =
    row(t('fired.res.pitz'), '+' + fmt(pitz), 'pos') +
    row(t('fired.res.notice') + ' (' + Math.round(nd) + ')', '+' + fmt(notice), 'pos') +
    row(t('fired.res.vac'), '+' + fmt(vac), 'pos') +
    row(t('fired.res.hav') + ' · ' + tf('fired.hav.rate', {r: havRate.toFixed(2).replace(/\.00$/, ''), s: t(pub ? 'fired.hav.pub' : 'fired.hav.priv')}), '+' + fmt(hav), 'pos');
}

// ======= Норма рабочего времени =======
// Сверено 29.07.2026 по כל-זכות: неделя 42 ч; день 8,6 ч при 5-дневке и 8 ч при 6-дневке;
// ночная смена (2+ ч в 22:00–06:00) и канун выходного/праздника — 7 ч;
// перерыв 45 мин (из них 30 непрерывно) положен после 6 ч физической работы,
// после 9 ч при 5-дневке / 8 ч при 6-дневке — для не физической;
// перерыв НЕ рабочее время и не оплачивается, ЕСЛИ работник вправе уйти;
// если обязан оставаться — входит в рабочие часы и оплачивается.
const WEEK_NORM = 42, BREAK_MIN = 0.75, DAY_CAP = 12, OT_WEEK_CAP = 16;
function whCalc() {
  const days5 = document.getElementById('whDays').value === '5';
  const manual = document.getElementById('whKind').value === 'manual';
  const shift = Math.max(0, +document.getElementById('whShift').value || 0);
  const per = Math.max(0, +document.getElementById('whPer').value || 0);
  const stay = document.getElementById('whStay').checked;
  const night = document.getElementById('whNight').checked;
  const eve = document.getElementById('whEve').checked;

  // Канун субботы/праздника: при 6-дневке короткий день 7 ч, при 5-дневке — 7 ч 36 мин
  // (неделя 42 = 4 × 8:36 + 7:36). Ночная смена — 7 ч в обоих графиках.
  const dayNorm = night ? 7 : eve ? (days5 ? 7.6 : 7) : (days5 ? 8.6 : 8);
  const breakAfter = manual ? 6 : (days5 ? 9 : 8);
  const brMin = whBreakVal();                          // длительность перерыва — настройка (внутренние правила)
  const paidBr = document.getElementById('whPaidBr').checked;
  const breakDue = shift >= breakAfter && brMin > 0 ? brMin / 60 : 0;
  const unpaid = breakDue && !stay && !paidBr ? breakDue : 0; // вычитается из оплачиваемых часов
  const paidHours = Math.max(0, shift - unpaid);
  const ot = Math.max(0, paidHours - dayNorm);
  const ot125 = Math.min(2, ot), ot150 = Math.max(0, ot - 2);
  const rate = Math.max(0, +document.getElementById('otRate').value || 0);
  const extra = rate * (0.25 * ot125 + 0.5 * ot150);   // доплата СВЕРХ обычной ставки
  // Сверхурочные считаются ДВАЖДЫ: по дню (сверх нормы дня) и по неделе (сверх 42 ч).
  // Часы сверх 42 в неделю — сверхурочные, даже если дневная норма не превышалась
  // (проверено 23.08.2026 по workrights.co.il, liatfaigel-law.co.il, ygoldlaw.co.il;
  // повод — замечание бухгалтера под постом в FB). Недельные считаем по 125%: это
  // «первые» сверхурочные часы своих дней.
  const weekPaid = paidHours * per, weekOtDay = ot * per;
  const weekRegular = (paidHours - ot) * per;                 // часы в пределах дневной нормы
  const weekOtExtra = Math.max(0, weekRegular - WEEK_NORM);   // они же сверх недельной нормы
  // деление 125/150 — как в табеле (tbWeeklyOT), чтобы два блока не расходились
  const w125 = Math.min(2, weekOtExtra), w150 = Math.max(0, weekOtExtra - 2);
  const weekOt = weekOtDay + weekOtExtra;
  const weekExtraPay = rate * (0.25 * w125 + 0.5 * w150);     // доплата за недельную переработку

  const h = tbHrs; // «8 ч 36 мин», не «8,6»
  let out = '<div style="margin-top:12px">';
  out += row(t('wh.o.week'), h(WEEK_NORM));
  out += row(t('wh.o.day'), h(dayNorm));
  out += row(t('wh.o.break'), breakDue
        ? tf('wh.o.break.due', {a: h(breakAfter), b: h(brMin / 60)}) + ' (' + t(manual ? 'wh.kind.manual' : 'wh.kind.office') + ') · ' +
          t(stay ? 'wh.o.break.paid' : paidBr ? 'wh.o.break.paidpol' : 'wh.o.break.unpaid')
        : tf('wh.o.break.no', {a: h(breakAfter)}) + ' (' + t(manual ? 'wh.kind.manual' : 'wh.kind.office') + ')');
  out += row(t('wh.o.paid'), h(paidHours), 'pos');
  out += row(t('wh.o.otfrom'), h(dayNorm));
  out += row(t('wh.o.ot'), ot ? h(ot125) + ' × 125% + ' + h(ot150) + ' × 150%' : t('wh.o.none'), ot ? 'neg' : '');
  if (ot && rate) out += row(t('wh.o.extra'), '+' + fmt(extra), 'pos');
  out += row(t('wh.o.weekly'), h(weekPaid) + (weekPaid > WEEK_NORM ? ' (+' + h(weekPaid - WEEK_NORM) + ')' : ''), weekPaid > WEEK_NORM ? 'neg' : 'pos');
  if (weekOtExtra) {
    out += row(t('wh.o.weekot'), h(w125) + ' × 125%' + (w150 ? ' + ' + h(w150) + ' × 150%' : '') +
               (rate ? ' · +' + fmt(weekExtraPay) : ''), 'neg');
  }
  out += '</div>';
  if (weekOtExtra) out += '<div class="note" style="margin-top:8px">' + t('wh.o.weekot.hint') + '</div>';

  const warn = [];
  if (shift > DAY_CAP) warn.push(tf('wh.w.day', {c: DAY_CAP}));
  if (weekOt > OT_WEEK_CAP) warn.push(tf('wh.w.week', {c: OT_WEEK_CAP}));
  if (breakDue && stay) warn.push(t('wh.w.stay'));
  if (warn.length) out += '<div class="note warn" style="margin-top:8px">' + warn.join('<br>') + '</div>';
  out += '<div class="note" style="margin-top:8px">' + t('wh.o.note') + '</div>';
  document.getElementById('whOut').innerHTML = out;
}

// ======= Табель: пунч прихода/ухода =======
// Записи только на устройстве (heshbon_tabel). Нормы — те же, что в whCalc.
// Шаббат (суббота) = все часы 150%; канун (пятница) и ночная смена = норма 7 ч.
const TB_KEY = 'heshbon_tabel', TB_OPEN = 'heshbon_tabel_open';
const tbLoad = () => { try { return JSON.parse(localStorage.getItem(TB_KEY) || '[]'); } catch (e) { return []; } };
const tbSave = a => { try { localStorage.setItem(TB_KEY, JSON.stringify(a)); } catch (e) {} };
const tbISO = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const tbHM = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
const tbDM = iso => new Intl.DateTimeFormat(t('locale'), {weekday: 'short', day: '2-digit', month: '2-digit'}).format(new Date(iso + 'T12:00:00'));
// «8 ч 36 мин» вместо «8,6 ч» — фидбек тестировщицы: десятичные часы заставляют гуглить
const tbHrs = n => {
  const neg = n < 0; n = Math.abs(n);
  let h = Math.floor(n + 1e-9), m = Math.round((n - h) * 60);
  if (m === 60) { h++; m = 0; }
  const s = (h && m) ? tf('fmt.hm', {h, m}) : h ? tf('fmt.h', {h}) : m ? tf('fmt.m', {m}) : tf('fmt.h', {h: 0});
  return (neg ? '−' : '') + s;
};
function tbParseTime(s) {
  const m = String(s).trim().match(/^(\d{1,2})[:.‐-]?(\d{2})?$/);
  if (!m) return null;
  const h = +m[1], mm = +(m[2] || 0);
  return (h > 23 || mm > 59) ? null : h * 60 + mm;
}
// перекрытие смены с ночным окном 22:00–06:00 (интервалы в минутах от начала суток старта)
function tbNightOverlap(inM, endM) {
  const ovl = (a, b, c, d) => Math.max(0, Math.min(b, d) - Math.max(a, c));
  return ovl(inM, endM, 0, 360) + ovl(inM, endM, 1320, 1440) + ovl(inM, endM, 1440, 1800);
}
function tbCalc(e) {
  // особые дни (болезнь/отпуск/праздник) — без часов, считаются отдельно в итогах
  if (e.ty && e.ty !== 'work') return { special: e.ty, dur: 0, paid: 0, overnight: false, shab: false,
                                        night: false, brMin: 0, ot125: 0, ot150: 0, shabH: 0 };
  const inM = tbParseTime(e.in), outM = tbParseTime(e.out);
  let dur = (outM - inM) / 60;
  const overnight = dur < 0; // ровно 0 = случайный двойной пунч, а не суточная смена
  if (overnight) dur += 24;
  // перерыв не вычитается, если «обязан оставаться» ИЛИ работодатель оплачивает его по внутренним правилам
  const brPaid = e.stay || document.getElementById('whPaidBr').checked;
  const paid = Math.max(0, dur - (brPaid ? 0 : (e.br || 0) / 60));
  const wd = new Date(e.d + 'T12:00:00').getDay(); // 0=вс … 5=пт, 6=сб
  const shab = wd === 6;
  const night = tbNightOverlap(inM, inM + dur * 60) >= 120;
  const days5 = document.getElementById('whDays').value === '5';
  const norm = shab ? 0 : (night || wd === 5) ? 7 : (days5 ? 8.6 : 8);
  const ot = shab ? 0 : Math.max(0, paid - norm);
  return { dur, paid, overnight, shab, night, brMin: brPaid ? 0 : (e.br || 0),
           ot125: Math.min(2, ot), ot150: Math.max(0, ot - 2), shabH: shab ? paid : 0 };
}
function tbMakeEntry(d, tin, tout) {
  const manual = document.getElementById('whKind').value === 'manual';
  const days5 = document.getElementById('whDays').value === '5';
  let dur = (tbParseTime(tout) - tbParseTime(tin)) / 60;
  if (dur < 0) dur += 24;
  const breakAfter = manual ? 6 : (days5 ? 9 : 8);
  return { id: Date.now(), d, in: tin, out: tout,
           br: dur >= breakAfter ? whBreakVal() : 0, stay: document.getElementById('whStay').checked };
}
function tbPunch() {
  let open = null;
  try { open = JSON.parse(localStorage.getItem(TB_OPEN) || 'null'); } catch (e) {}
  const N = window.HeshbonNative; // в APK — мост, в вебе undefined
  if (!open) {
    localStorage.setItem(TB_OPEN, JSON.stringify({d: tbISO(new Date()), in: tbHM(new Date())}));
    try { if (N && N.shiftOpened) N.shiftOpened(); } catch (e) {} // напоминание «отметь уход» через 11 ч
  } else {
    const a = tbLoad();
    a.push(tbMakeEntry(open.d, open.in, tbHM(new Date())));
    tbSave(a);
    localStorage.removeItem(TB_OPEN);
    try { if (N && N.shiftClosed) N.shiftClosed(); } catch (e) {}
  }
  tbRender();
}
let tbEditingId = null; // id записи в режиме правки (клик по строке)

function tbAdd() {
  const ty = document.getElementById('tbType').value;
  const tin = document.getElementById('tbIn').value, tout = document.getElementById('tbOut').value;
  const bad = ty === 'work' && (tbParseTime(tin) === null || tbParseTime(tout) === null);

function tbMonthRows(mon) {

const TY_ICO = {sick: '🤒', vacation: '🌴', holiday: '🎉'};
const TY_KEY = {sick: 'tb.ty.sick', vacation: 'tb.ty.vac', holiday: 'tb.ty.hol'};
// Итоги месяца: часы/OT/шаббат/перерывы + особые дни. Больничные — по эпизодам подряд:
// 1-й день 0%, 2–3-й 50%, с 4-го 100% (эпизод считается внутри выбранного месяца)
function tbMonthTotals(mon) {
  const tot = {workN: 0, paid: 0, ot125: 0, ot150: 0, shab: 0, br: 0, anyON: false,
               sickN: 0, vacN: 0, holN: 0, sickDates: []};
  tbMonthRows(mon).forEach(e => {
    const c = tbCalc(e);
    if (c.special) {
      if (c.special === 'sick') { tot.sickN++; tot.sickDates.push(e.d); }
      else if (c.special === 'vacation') tot.vacN++;
      else tot.holN++;
      return;
    }
    tot.workN++;
    tot.paid += c.paid; tot.ot125 += c.ot125; tot.ot150 += c.ot150; tot.shab += c.shabH; tot.br += c.brMin;
    tot.anyON = tot.anyON || c.overnight;
  });
  const ds = [...new Set(tot.sickDates)].sort();
  let f = 0, run = 0, prev = null;
  ds.forEach(d => {
    run = (prev && (new Date(d + 'T12:00:00') - new Date(prev + 'T12:00:00')) === 86400000) ? run + 1 : 1;
    f += run === 1 ? 0 : (run <= 3 ? 0.5 : 1);
    prev = d;
  });
  tot.sickFactor = f;
  return tot;
}
// Недельный канал сверхурочных (прецедент ארצי 188/06, кользхут): часы, НЕ учтённые как
// дневные OT, сверх 42 ч/нед → первые 2 ч 125%, дальше 150%. Неделя вс–сб; неделя относится
// к месяцу, в котором заканчивается (суббота). Шаббат-часы не входят в недельную норму —
// они уже оплачены 150% отдельным правилом (консервативно, не завышаем претензию).
const TB_WEEK_NORM = 42;
function tbWeeklyOT(mon) {
  const byWeek = {};
  tbLoad().forEach(e => {
    if (e.ty && e.ty !== 'work') return;
    const c = tbCalc(e);
    if (c.shab) return;
    const dt = new Date(e.d + 'T12:00:00');
    const sat = new Date(dt); sat.setDate(dt.getDate() + (6 - dt.getDay()));
    const k = tbISO(sat);
    byWeek[k] = (byWeek[k] || 0) + (c.paid - c.ot125 - c.ot150);
  });
  const w = {w125: 0, w150: 0};
  Object.keys(byWeek).forEach(k => {
    if (k.slice(0, 7) !== mon) return;
    const ex = Math.max(0, byWeek[k] - TB_WEEK_NORM);
    w.w125 += Math.min(2, ex); w.w150 += Math.max(0, ex - 2);
  });
  return w;
}

// Транслитерация кириллицы в ивритское письмо для подписи под документом (v1.18).
// Правила как в бытовой практике: гласные «а/е» в середине не пишутся, о/у → ו, и/ы → י,
// конечная «а» → ה, у м/н/п/ц — конечные формы букв.
const HE_TR = {а:'א',б:'ב',в:'ב',г:'ג',д:'ד',е:'',ё:'יו',ж:'ז',з:'ז',и:'י',й:'י',к:'ק',л:'ל',м:'מ',н:'נ',
  о:'ו',п:'פ',р:'ר',с:'ס',т:'ט',у:'ו',ф:'פ',х:'ח',ц:'צ',ч:'צ',ш:'ש',щ:'ש',ъ:'',ы:'י',ь:'',э:'א',ю:'יו',я:'יה'};
const HE_FINAL = {'מ':'ם','נ':'ן','פ':'ף','צ':'ץ'};
function heTranslit(s) {
  return String(s || '').trim().split(/\s+/).filter(Boolean).map(word => {
    const ch = word.toLowerCase().split('');
    let out = '';
    ch.forEach((c, i) => {
      const last = i === ch.length - 1;
      if (c === 'а') { out += (i === 0 ? 'א' : last ? 'ה' : ''); return; } // «а» внутри слова не пишется
      if (c === 'е') { out += (i === 0 ? 'י' : ''); return; }              // Елена → ילנה
      if (c === 'в') { out += (i === 0 ? 'ו' : 'ב'); return; }             // Волков → וולקוב, Шишканова → שישקנובה
      if (i === 0 && (c === 'и' || c === 'о' || c === 'у')) {              // гласная в начале — с алефом
        out += (c === 'и' ? 'אי' : 'או'); return;                          // Иванова → איבנובה, Ольга → אולגה
      }
      if (c === 'й' && ch[i - 1] === 'и') return;                          // Дмитрий → דמיטרי, без двойной йод
      const m = HE_TR[c];
      if (m === undefined) { out += /[a-z0-9'\-]/.test(c) ? c : ''; return; }
      out += m;
    });
    // конечная форма последней буквы
    const lastCh = out.slice(-1);
    if (HE_FINAL[lastCh]) out = out.slice(0, -1) + HE_FINAL[lastCh];
    return out;
  }).join(' ');
}

// ======= Сверка табеля с тлушем =======
function tbCompare() {
  const mon = document.getElementById('tbMonth').value;
  const box = document.getElementById('tbCmp');
  let store = null;
  try { store = JSON.parse(localStorage.getItem('heshbon_tlush') || 'null'); } catch (e) {}
  if (!store || !store.last) {
    box.innerHTML = '<div class="note warn" style="margin-top:8px">' + t('tb.cmp.noscan') + '</div>';
    return;
  }
  const mm = mon.slice(5, 7), yy = mon.slice(0, 4);
  const match = (store.hist || []).filter(h => h && h.month && String(h.month).includes(mm) && String(h.month).includes(yy));
  const scan = match.length ? match[match.length - 1] : store.last;
  const tot = tbMonthTotals(mon);
  const rate = Math.max(0, +document.getElementById('otRate').value || 0);
  const dayNorm = document.getElementById('whDays').value === '5' ? 8.6 : 8;
  const wk = tbWeeklyOT(mon);
  const extra = rate * (0.25 * (tot.ot125 + wk.w125) + 0.5 * (tot.ot150 + wk.w150) + 0.5 * tot.shab);
  const expect = rate * tot.paid + extra + (tot.sickFactor + tot.vacN + tot.holN) * dayNorm * rate;
  const issues = [];
  let diff = 0;
  if (scan.hours != null && Math.abs(scan.hours - tot.paid) >= 1) {
    issues.push(tf(scan.hours < tot.paid ? 'tb.cmp.hless' : 'tb.cmp.hmore', {a: tbHrs(scan.hours), b: tbHrs(tot.paid)}));
  }
  if (scan.hourly_rate != null && rate - scan.hourly_rate > 0.1) issues.push(tf('tb.cmp.rate', {a: scan.hourly_rate, b: rate}));
  if ((tot.ot125 + tot.ot150 + wk.w125 + wk.w150 + tot.shab) > 0.2 && !(scan.overtime_pay > 0)) issues.push(t('tb.cmp.noot'));
  if (scan.gross != null && rate && expect > scan.gross + 50) {
    diff = Math.round(expect - scan.gross);
    issues.push(tf('tb.cmp.pay', {e: fmt(expect), g: fmt(scan.gross), d: fmt(diff)}));
  }
  let out = '<div class="note' + (issues.length ? ' warn' : '') + '" style="margin-top:8px"><b>' +
    tf('tb.cmp.h', {m: scan.month || '—'}) + '</b>' + (match.length ? '' : '<br>' + t('tb.cmp.lastused')) + '<br>';
  out += issues.length ? '• ' + issues.join('<br>• ') + '<br>' + t('tb.cmp.what') : t('tb.cmp.ok');
  out += '</div>';
  if (issues.length) out += '<button class="btn ghost" onclick="ltFromCmp()">✉️ ' + t('lt.t.pay') + '</button>';
  box.innerHTML = out;
  ltPrefill = issues.length ? {month: mm + '/' + yy, hours: Math.round(tot.paid * 10) / 10, diff: diff || null} : null;
}

// ======= Сравнение двух офферов: нетто по некудот пользователя + «невидимый пакет» =======
// Пакет = минимумы цав пенсия хова (работодатель 6,5% пенсия + 6% пицуим; полная ст.14 = 8,33)
// + иштальмут 7,5% сверху, если отмечен. Считаем тем же движком netOf, что и обратный расчёт.
function calcOffers() {
  const ptsEl = document.getElementById('ofPts');
  if (ptsEl.value === '') ptsEl.value = +document.getElementById('empPoints').value || 2.25;
  const pts = +ptsEl.value || 0, pen = document.getElementById('ofPen').checked;
  const myNi = empNiRates(); // офферы сравниваем для этого пользователя: статус/пенсионерский режим учтены
  const r = ['A', 'B'].map(k => {
    const g = +document.getElementById('of' + k).value || 0;
    const hish = document.getElementById('ofHish' + k).checked;
    const net = g > 0 ? netOf(g, pts, pen, myNi) - (hish ? g * 0.025 : 0) : 0;
    const pack = g > 0 ? (pen ? g * (0.065 + 0.06) : 0) + (hish ? g * 0.075 : 0) : 0;
    return {g, net, pack, tot: net + pack};
  });
  const out = document.getElementById('ofOut');
  if (!(r[0].g > 0) || !(r[1].g > 0)) { out.innerHTML = ''; return; }
  const d = r[1].tot - r[0].tot;
  // метки офферов берём из словаря: в русском это «А»/«Б», латинская B читалась как «В» (фидбек 10.08)
  const verdict = Math.abs(d) < 50 ? t('of.eq')
    : tf('of.win', {x: t(d > 0 ? 'of.lb' : 'of.la'), d: fmt(Math.abs(d))});
  out.innerHTML = '<div style="margin-top:10px">' +
    row(t('of.net'), fmt(r[0].net) + ' · ' + fmt(r[1].net), 'pos') +
    row(t('of.pack'), fmt(r[0].pack) + ' · ' + fmt(r[1].pack)) +
    row(t('of.tot'), fmt(r[0].tot) + ' · ' + fmt(r[1].tot), 'pos') +
    row(t('of.diff'), (d >= 0 ? '+' : '−') + fmt(Math.abs(d))) +
    '</div><div class="note" style="margin-top:6px"><b>' + verdict + '</b></div>';
}
['ofA', 'ofB', 'ofHishA', 'ofHishB', 'ofPts', 'ofPen'].forEach(id =>
  document.getElementById(id).addEventListener('input', () => {
    if (document.getElementById('ofOut').innerHTML) calcOffers(); // живой пересчёт после первого «Сравнить»
  }));

  if (!box) return;

  list.filter(h => h[0].slice(0, 4) === year).forEach(h => { hol[h[0]] = t(h[1]); });
  const months = [...new Set(Object.keys(hol).map(d => +d.slice(5, 7)))].sort((a, b) => a - b);
  if (!months.length) { box.innerHTML = ''; return; }
  const MON = (I18N[LANG] && I18N[LANG]['months.full']) || t('months');
  const dow = t('tb.print.days').split('|'); // вс..сб, уже локализованы
  const today = tbISO(new Date());
  box.innerHTML = '<div class="holcal">' + months.map(m => {
    const first = new Date(+year, m - 1, 1), days = new Date(+year, m, 0).getDate();
    let cells = '';
    for (let i = 0; i < first.getDay(); i++) cells += '<i></i>'; // отступ до первого дня недели
    for (let d = 1; d <= days; d++) {
      const iso = year + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      const cls = [hol[iso] ? 'hd' : '', new Date(+year, m - 1, d).getDay() === 6 ? 'sb' : '', iso === today ? 'td' : ''].filter(Boolean).join(' ');
      cells += '<i class="' + cls + '"' + (hol[iso] ? ' title="' + escT(hol[iso]) + '"' : '') + '>' + d + '</i>';
    }
    return '<div class="hm"><div class="hm-t">' + MON[m - 1] + '</div>' +
           '<div class="hm-d">' + dow.map(x => '<b>' + x.slice(0, 2) + '</b>').join('') + '</div>' +
           '<div class="hm-g">' + cells + '</div></div>';
  }).join('') + '</div><div class="note holcal-lg"><span class="hd"></span> ' + t('hol.cal.leg') + '</div>';
}
function holSoonNote() { // «сегодня/завтра праздник» — для статуса в табеле
  const conf = localStorage.getItem('heshbon_conf') || 'jew';
  if (conf === 'mus' || conf === 'none') return '';
  const list = conf === 'chr' ? HOL_CHR : HOL_JEW;
  const t0 = tbISO(new Date());
  const d1 = new Date(); d1.setDate(d1.getDate() + 1);
  const t1 = tbISO(d1);
  const hit = list.find(h => h[0] === t0 || h[0] === t1);

function tbConsumePendingOut() {
  const N = window.HeshbonNative;
  if (!N || !N.getPendingOut) return;
  try {
    const po = +N.getPendingOut() || 0;
    if (po > 0) {
      let open = null;
      try { open = JSON.parse(localStorage.getItem(TB_OPEN) || 'null'); } catch (e) {}
      if (open) {
        const a = tbLoad();
        a.push(tbMakeEntry(open.d, open.in, tbHM(new Date(po))));
        tbSave(a);
        localStorage.removeItem(TB_OPEN);
      }
      N.clearPendingOut();
    }
  } catch (e) {}
}

// сброс вопроса и ответа одним нажатием (фидбек 09.08: раньше текст приходилось стирать вручную)
function aiClear(inputId, targetId) {
  const q = document.getElementById(inputId), a = document.getElementById(targetId);
  q.value = '';
  a.style.display = 'none';
  a.innerHTML = '';
  q.focus();
}
function aiAsk(inputId, targetId) {
  const q = document.getElementById(inputId).value.trim();
  const target = document.getElementById(targetId);
  if (!q) return;
  const low = q.toLowerCase();
  const scored = AI_TOPICS.map((tp, i) => {
    let hits = 0;
    for (const w of tp.kw) if (low.includes(w)) hits++;
    const ok = hits >= (tp.min || 1); // min: тема требует несколько совпадений (напр. «увол»+«больничн»)
    return { tp, i, score: ok ? hits + (tp.prio || 0) : 0 };
  }).filter(s => s.score > 0).sort((a, b) => b.score - a.score || a.i - b.i);
  let ans = null;
  if (scored.length) {
    const best = scored.filter(s => s.score === scored[0].score).slice(0, 2); // при равном счёте — до двух тем
    ans = best.map(s => (s.tp.s25 && segVal('empStatus') === 's25') ? t(s.tp.s25) : t(s.tp.key)).join('<hr style="border:0;border-top:1px dashed var(--border);margin:9px 0">');
  }
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  target.style.display = 'block';
  target.innerHTML = '💬 <b>«' + esc(q) + '»</b><br>' + (ans || t('ai.nomatch'))
    + '<br><button class="btn ghost" style="margin-top:9px;padding:9px" data-q="' + esc(q).replace(/"/g, '&quot;') + '" data-target="' + targetId + '" onclick="aiOnline(this)">' + t('ai.online.btn') + '</button>';
  if (!ans) { // копилка неотвеченных → пополнение базы
    const l = unList(); l.push({q, lang: LANG, ts: Date.now()});
    try { localStorage.setItem(UN_KEY, JSON.stringify(l.slice(-50))); } catch (e) {}
    unUpdate();
    // v1.18 (фидбек 10.08 «отвечает заглушкой и отправляет жать вторую кнопку»):
    // темы нет в офлайн-базе — сразу спрашиваем живого Claude, без лишнего клика.
    // Типовые вопросы по-прежнему отвечаются офлайн: мгновенно, без сети и без расхода лимита.
    const auto = target.querySelector('button');
    if (auto && (+localStorage.getItem(aiQuotaKey()) || 0) < AI_DAILY) aiOnline(auto);
  }
}

/* ======= Подписка (v1.22, 17.08.2026): Stripe Checkout =======
   Аккаунтов в приложении нет и заводить их незачем: после оплаты воркер выдаёт КОД ДОСТУПА
   (HP-XXXX-...), он лежит в localStorage и уходит в заголовке X-HP-Lic. На другом устройстве
   код вводят руками или получают письмом. Отмена — через Customer Portal Stripe. */
// 17.08.2026: платность ВЫКЛЮЧЕНА до возвращения Марины из отпуска (нужен эсек/квитанции).
// Приложение бесплатное целиком, растим базу; вся механика подписки ниже жива и включается
// одним флагом — вместе с BILLING = "on" в wrangler.toml воркера.
const BILLING_ON = false;
const SUB_KEY = 'heshbon_sub';
const DEV_KEY = 'heshbon_dev';
let SUB = null;
try { SUB = JSON.parse(localStorage.getItem(SUB_KEY) || 'null'); } catch (e) {}
function devId() {
  let d = localStorage.getItem(DEV_KEY);
  if (!d) {
    d = ((crypto && crypto.randomUUID) ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36))
      .replace(/[^a-zA-Z0-9]/g, '');
    try { localStorage.setItem(DEV_KEY, d); } catch (e) {}
  }
  return d;
}
function subActive() { return !!(SUB && SUB.code && SUB.until && SUB.until > Date.now()); }
// Пока биллинг выключен, AI открыт всем: платный режим — это subActive(), доступ — aiUnlocked().
function aiUnlocked() { return !BILLING_ON || subActive(); }
function subSave(s) {
  SUB = s;
  try { s ? localStorage.setItem(SUB_KEY, JSON.stringify(s)) : localStorage.removeItem(SUB_KEY); } catch (e) {}
  subRender();
}
function billFetch(path, body) {
  return fetch(AI_URL + '/billing/' + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-HP-Key': AI_KEY},
    body: JSON.stringify(body || {}),
  }).then(r => r.json().catch(() => ({})).then(j => {
    if (!r.ok) { const e = new Error('bill'); e.http = r.status; e.code = j && j.error; throw e; }
    return j;
  }));
}
function subDate(ms) {
  try { return new Date(ms).toLocaleDateString(LANG === 'he' ? 'he-IL' : (LANG === 'en' ? 'en-GB' : 'ru-RU')); }
  catch (e) { return ''; }
}
// Оплата: уводим на Stripe Checkout. Карту вводят у Stripe — приложение её не видит.
function subBuy(plan, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = t('sub.wait');
  billFetch('checkout', { plan: plan, lang: LANG, dev: devId() })
    .then(d => { if (!d.url) throw 0; location.href = d.url; })
    .catch(e => {
      btn.disabled = false; btn.textContent = old;
      subMsg(e && e.code === 'billing_off' ? t('sub.err.off') : t('sub.err.pay'), true);
    });
}
function subMsg(text, warn) {
  const box = document.getElementById('subMsg');
  if (!box) return;
  box.className = 'note' + (warn ? ' warn' : '');
  box.textContent = text;
  box.style.display = 'block';
}
// Возврат из Checkout: сессия → код доступа. Вебхук может опоздать, поэтому спрашиваем Stripe прямо.
function subClaim(sessionId) {
  document.getElementById('premModal').style.display = 'flex';
  subMsg(t('sub.claiming'));
  return billFetch('claim', { session_id: sessionId })
    .then(d => {
      subSave({ code: d.code, until: d.until, plan: d.plan, email: d.email || '', checked: Date.now() });
      subMsg(tf('sub.thanks', {d: subDate(d.until)}));
    })
    .catch(e => subMsg(e && e.code === 'not_paid' ? t('sub.err.notpaid') : t('sub.err.claim'), true));
}
function subApplyCode(raw, silent) {
  const code = String(raw || '').trim();
  if (!code) return Promise.resolve(false);
  return billFetch('status', { code: code })
    .then(d => {
      if (!d.active) { if (!silent) subMsg(t('sub.err.expired'), true); return false; }
      subSave({ code: code.toUpperCase(), until: d.until, plan: d.plan, email: d.email || '',
                cancel: !!d.cancel_at_period_end, checked: Date.now() });
      if (!silent) subMsg(tf('sub.restored', {d: subDate(d.until)}));
      return true;
    })
    .catch(e => {
      if (!silent) subMsg(e && (e.code === 'unknown_code' || e.code === 'bad_code') ? t('sub.err.badcode') : t('sub.err.pay'), true);
      return false;
    });
}
// Раз в 12 часов сверяемся с сервером: продление, отмена, неудачное списание.
function subRefresh() {
  if (!SUB || !SUB.code) return;
  if (SUB.checked && Date.now() - SUB.checked < 12 * 3600e3 && SUB.until > Date.now() + 3 * 86400e3) return;
  billFetch('status', { code: SUB.code }).then(d => {
    const next = {}; for (const k in SUB) next[k] = SUB[k];
    next.until = d.until; next.plan = d.plan; next.cancel = !!d.cancel_at_period_end; next.checked = Date.now();
    subSave(next);
  }).catch(() => {});
}
function subPortal(btn) {
  if (!SUB || !SUB.code) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = t('sub.wait');
  billFetch('portal', { code: SUB.code, lang: LANG })
    .then(d => { if (!d.url) throw 0; location.href = d.url; })
    .catch(() => { btn.disabled = false; btn.textContent = old; subMsg(t('sub.err.pay'), true); });
}
function subRestoreByMail(btn) {
  const el = document.getElementById('subEmail');
  const email = ((el && el.value) || '').trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { subMsg(t('sub.err.mail'), true); return; }
  btn.disabled = true;
  billFetch('restore', { email: email })
    .then(() => subMsg(t('sub.mail.sent')))
    .catch(e => subMsg(e && e.code === 'contact_support' ? t('sub.err.support') : t('sub.err.pay'), true))
    .then(() => { btn.disabled = false; });
}
function subEnterCode() {
  const el = document.getElementById('subCode');
  subApplyCode(el ? el.value : '');
}
function subCopyCode(btn) {
  if (!SUB || !SUB.code) return;
  const done = () => { const o = btn.textContent; btn.textContent = t('sub.copied'); setTimeout(() => { btn.textContent = o; }, 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(SUB.code).then(done, () => {});
  else {
    const ta = document.createElement('textarea'); ta.value = SUB.code; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  }
}
// Перерисовка блоков подписки в модалке и в настройках.
function subRender() {
  const on = subActive();
  document.querySelectorAll('.sub-on').forEach(el => { el.style.display = on ? '' : 'none'; });
  document.querySelectorAll('.sub-off').forEach(el => { el.style.display = on ? 'none' : ''; });
  // ценники, оплата и юр. блок про автосписания появляются только вместе с включённым биллингом
  document.querySelectorAll('.bill-only').forEach(el => { if (!BILLING_ON) el.style.display = 'none'; });
  document.querySelectorAll('.free-only').forEach(el => { el.style.display = BILLING_ON ? 'none' : ''; });
  const text = !BILLING_ON ? t('sub.free.status')
    : (on ? tf(SUB.cancel ? 'sub.status.ending' : 'sub.status.on', {d: subDate(SUB.until)}) : t('sub.status.off'));
  ['subStatus', 'subStatusSet'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  });
  const code = document.getElementById('subMyCode');
  if (code) code.textContent = on ? SUB.code : '';
  if (!BILLING_ON) {
    // пока денег не берём, окно рассказывает о возможностях, а не о тарифе
    const price = document.getElementById('premPrice');
    if (price) price.textContent = t('sub.free.price');
    const h = document.querySelector('#premModal h2');
    if (h) h.textContent = t('prem.free.title');
    const s = document.querySelector('#premModal .sub');
    if (s) s.textContent = t('prem.free.sub');
    document.querySelectorAll('[data-i18n="prem.btn.short"]').forEach(el => { el.textContent = t('prem.free.btn'); });
  }
}
function subOpen(reason) { // paywall: воркер ответил 402 либо кончилась бесплатная проба
  const m = document.getElementById('premModal');
  if (m) m.style.display = 'flex';
  if (reason) subMsg(t(reason === 'paid_only' ? 'sub.gate.paid' : 'sub.gate.free'), true);
}

/* ======= Каталог специалистов и связь с аудиторией (v1.22) =======
   Пока приложение бесплатное, деньги обещают дать не подписки, а размещение адвокатов
   и бухгалтеров. Каталог лежит в partners.json рядом с приложением: чтобы добавить партнёра,
   правится только этот файл. Платные карточки помечаются как реклама — иначе это вводит
   человека в заблуждение ровно там, где он ищет защиты. */
const FORM_URL = 'https://formspree.io/f/xnjyekar'; // общая форма проектов, различаем полем project
function sendForm(project, data, btn, msgId, okKey) {
  const box = document.getElementById(msgId);
  const old = btn.textContent;
  const show = (text, warn) => {
    if (!box) return;
    box.className = 'note' + (warn ? ' warn' : '');
    box.textContent = text; box.style.display = 'block';
  };
  btn.disabled = true; btn.textContent = t('sub.wait');
  const payload = { project: project, lang: LANG };
  for (const k in data) payload[k] = data[k];
  fetch(FORM_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
    body: JSON.stringify(payload),
  }).then(r => {
    btn.disabled = false; btn.textContent = old;
    if (!r.ok) throw 0;
    show(t(okKey));
    btn.style.display = 'none';
  }).catch(() => {
    btn.disabled = false; btn.textContent = old;
    show(t('keep.err'), true);
  });
}
/* Анонимные счётчики: имя события и обезличенный id устройства, ничего больше.
   Ответ не ждём и ошибки глотаем — статистика не должна мешать человеку работать. */
function statHit(ev) {
  try {
    // id устройства кладём в тело, а не в заголовок: лишние заголовки требуют preflight,
    // а он падает на воркерах, которые о них не знают (см. тот же урок в aiFetch)
    fetch(AI_URL + '/stat', {
      method: 'POST', keepalive: true,
      headers: {'Content-Type': 'application/json', 'X-HP-Key': AI_KEY},
      body: JSON.stringify({ ev: ev, lang: LANG, dev: devId() }),
    }).catch(() => {});
  } catch (e) {}
}
function statOpenOnce() { // запуск считаем раз в сутки, иначе цифра превращается в шум
  const k = 'heshbon_stat_open';
  const today = new Date().toISOString().slice(0, 10);
  if (localStorage.getItem(k) === today) return;
  try { localStorage.setItem(k, today); } catch (e) {}
  statHit('open');
}
let PARTNERS = null;
function ptLoad() {

  return fetch('partners.json', {cache: 'no-cache'})

    .then(d => { PARTNERS = Array.isArray(d.items) ? d.items : []; ptRender(); return PARTNERS; })

}
function ptRender() {
  const list = document.getElementById('ptList'), empty = document.getElementById('ptEmpty');
  if (!list || !empty) return;

function keepJoin(btn) {

// v1.18 (жалоба 10.08 «пишет „нет сети“, хотя сеть есть»): единый запрос к воркеру с таймаутом
// и РАЗЛИЧИМЫМИ ошибками — ответ сервера с кодом, обрыв по времени и настоящий сетевой сбой.
function aiFetch(body, ms) {
  const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), ms || 60000) : 0;
  // X-HP-Lic — код подписки, X-HP-Dev — анонимный id устройства для бесплатной пробы (v1.22).
  // Пока платности нет, оба заголовка не нужны: без них запрос совместим и со старым воркером,
  // который не знает этих полей и отбил бы preflight, положив вообще все AI-функции.
  const headers = {'Content-Type': 'application/json', 'X-HP-Key': AI_KEY};
  if (BILLING_ON) {
    headers['X-HP-Dev'] = devId();
    if (SUB && SUB.code) headers['X-HP-Lic'] = SUB.code;
  }
  const opt = { method: 'POST', headers: headers, body: JSON.stringify(body) };
  if (ctrl) opt.signal = ctrl.signal;
  return fetch(AI_URL, opt).then(r => {
    if (timer) clearTimeout(timer);
    if (!r.ok) return r.json().catch(() => ({})).then(j => {
      const e = new Error('http'); e.http = r.status;
      e.code = j && j.error;        // 'upstream' | 'too_big' | 'no_answer' | 'subscription_required'
      e.up = j && j.code;           // код самого Anthropic: 429/529 = перегрузка
      e.reason = j && j.reason;     // для 402: 'free_used' | 'paid_only' | 'ip_cap'
      throw e;
    });
    return r.json();
  }, e => { if (timer) clearTimeout(timer); throw e; });
}
function aiErrText(e) {
  if (e && e.name === 'AbortError') return t('ai.err.timeout');
  if (e && e.http) {
    // 402 от воркера (v1.22): бесплатная проба кончилась или режим только по подписке
    if (e.code === 'subscription_required') { subOpen(e.reason); return t(e.reason === 'paid_only' ? 'sub.gate.paid' : 'sub.gate.free'); }
    if (e.code === 'too_big') return t('ai.err.big');
    if (e.code === 'no_credit') return t('ai.err.nocredit'); // баланс API исчерпан — не вина фото и не «перегрузка»
    if (e.code === 'cap_reached') return t('ai.err.cap');    // дневной потолок расходов воркера — до полуночи UTC
    // 429/500/529 у Anthropic = перегрузка; воркер уже сделал 3 попытки — просим повторить позже
    if (e.code === 'upstream' && [429, 500, 502, 503, 529].includes(+e.up)) return t('ai.err.busy');
    if (e.code === 'no_answer') return t('ai.err.busy');
    return tf('ai.err.server', {c: e.up || e.http});
  }
  return t('ai.online.err'); // fetch не дошёл — действительно нет связи
}
// Статус для AI-режимов воркера. Воркер режет status до 24 символов, поэтому пенсионерские
// уточнения — компактными токенами, которые FACTS воркера узнаёт: '+kitzba' (получает кицбат
// зикна), '+pens62-67/67-70/70+' (пенс. возраст без кицбы), '+exempt67' (принят после 67
// с пенсией → работодатель может быть освобождён от пенсии). Самый длинный вариант
// 'resident+kitzba+exempt67' = ровно 24. При exempt возрастную скобку опускаем — освобождение важнее.
function aiStatus() {
  const st = segVal('empStatus');
  const r = retireeState();
  if (!r.on) return st;
  if (r.kitzba) return st + '+kitzba' + (r.exempt ? '+exempt67' : '');
  if (r.exempt) return st + '+pens+exempt67';
  return st + '+pens' + ({a6267: '62-67', a6770: '67-70', a70: '70+'}[r.age] || '');
}
function aiOnline(btn) {
  const q = btn.dataset.q, targetId = btn.dataset.target;
  const used = +localStorage.getItem(aiQuotaKey()) || 0;
  if (!subActive() && used >= AI_DAILY) {   // у подписчика дневного потолка нет (v1.22)
    const n = document.createElement('div'); n.className = 'note warn';
    n.textContent = tf('ai.online.limit', {n: AI_DAILY});
    btn.replaceWith(n); return;
  }
  btn.disabled = true; btn.textContent = t('ai.online.wait');
  aiFetch({ q, lang: LANG, status: aiStatus() })
    .then(d => {
      if (!d.answer) throw 0;
      try { localStorage.setItem(aiQuotaKey(), used + 1); } catch (e) {}
      statHit('qa');
      const div = document.createElement('div');
      div.className = 'viol dk';
      div.innerHTML = '<b>' + t('ai.online.tag') + '</b>' +
        d.answer.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
      btn.replaceWith(div);
    })
    .catch(e => {
      btn.disabled = false; btn.textContent = t('ai.online.btn');
      const n = document.createElement('div'); n.className = 'note warn'; n.textContent = aiErrText(e);
      btn.after(n); setTimeout(() => n.remove(), 6000);
    });
}

// ======= Анализ трудового договора (β): текст ИЛИ фото листов → mode=contract =======
const CT_MAXPAGES = 12;
let ctPages = []; // [{b64, media, du|name}] — листы по порядку
document.getElementById('ctFiles').addEventListener('change', function () {
  const files = Array.from(this.files || []);
  this.value = '';
  if (!files.length) return;
  const pdf = files.find(f => f.type === 'application/pdf');
  if (pdf) { // PDF идёт один и заменяет выбранные фото
    if (pdf.size > 2500000) { ctPhotoNote(t('tlush.toobig')); return; }
    const fr = new FileReader();
    fr.onerror = () => ctPhotoNote(t('tlush.badfile'));
    fr.onload = () => {
      ctPages = [{ b64: String(fr.result).slice(String(fr.result).indexOf(',') + 1), media: 'application/pdf', name: pdf.name }];
      ctThumbs();
    };
    fr.readAsDataURL(pdf);
    return;
  }
  const have = ctPages.filter(p => p.media !== 'application/pdf').length;
  if (files.length > CT_MAXPAGES - have) { ctPhotoNote(tf('ct.maxpages', {n: CT_MAXPAGES})); return; }
  // 5+ листов — жмём до 1280px, чтобы весь договор уложился в один запрос
  const targetDim = (have + files.length) > 4 ? 1280 : 1568;
  const res = new Array(files.length); let done = 0, bad = 0;
  files.forEach((f, i) => compressPhoto(f,
    (b64, media, du) => { res[i] = {b64, media, du}; if (++done === files.length) fin(); },
    () => { bad++; if (++done === files.length) fin(); }, targetDim));
  function fin() { // порядок листов сохраняем по индексу выбора
    ctPages = ctPages.filter(p => p.media !== 'application/pdf').concat(res.filter(Boolean));
    ctThumbs();
    if (bad) ctPhotoNote(t('tlush.badfile'));
  }
});
function ctThumbs() {
  const box = document.getElementById('ctThumbs');
  if (!ctPages.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = 'block';
  box.innerHTML = ctPages.map((p, i) => '<span class="ct-pg" onclick="ctPageDel(' + i + ')">'
    + (p.media === 'application/pdf' ? '📄 ' + escT(p.name) : '<img src="' + p.du + '" alt=""><i>' + (i + 1) + '</i>')
    + '<span class="x">✕</span></span>').join('')
    + '<div class="hint" style="margin-top:5px">' + tf('ct.pages', {n: ctPages.length}) + '</div>';
}
function ctPageDel(i) { ctPages.splice(i, 1); ctThumbs(); }
function ctPhotoNote(msg) {
  const box = document.getElementById('ctThumbs');
  box.style.display = 'block';
  const n = document.createElement('div'); n.className = 'note warn'; n.textContent = msg;
  box.appendChild(n); setTimeout(() => n.remove(), 5000);
}

function aiContract() {
  const txt = document.getElementById('ctText').value.trim();
  const target = document.getElementById('ctAns');
  // без фото нужен текст; с фото текст не обязателен (уйдёт как примечание работника)

// ======= Скан тлуша (β): фото/PDF → воркер (mode=tlush) → строки + анализ =======
// Распознанные цифры остаются в localStorage — следующий скан сравнивается с ними.
const TL_KEY = 'heshbon_tlush';
// Сканов в месяц без подписки. Пока приложение бесплатное — лимит щадящий (расход на модель),
// с включением биллинга ужимается до 1 и ровно столько же считает воркер.
const TL_FREE = BILLING_ON ? 1 : 3;
const escT = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt2 = n => new Intl.NumberFormat(t('locale'), {maximumFractionDigits: 2}).format(+n) + ' ₪';
function tlMonthKey() { return 'heshbon_tlush_m_' + new Date().toISOString().slice(0, 7); }
function tlStore() { try { return JSON.parse(localStorage.getItem(TL_KEY) || '{}'); } catch (e) { return {}; } }
let tlSel = null; // выбранный файл: {b64, media}

// Общее сжатие фото для сканов (тлуш + листы договора): JPEG, белый фон.
// maxDim: тлуш и короткие договоры — 1568px; многостраничные договоры — 1280px,
// чтобы 10-12 листов уложились в лимит запроса (печатный текст читается и так).
function compressPhoto(file, onDone, onErr, maxDim) {
  const fr = new FileReader();
  fr.onerror = () => onErr();
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => onErr(); // HEIC и прочая экзотика не декодируется
    img.onload = () => {
      const MAX = maxDim || 1568, k = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // прозрачный PNG → белый фон
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.85, du = c.toDataURL('image/jpeg', q);
      while (du.length > 2800000 && q > 0.4) { q -= 0.15; du = c.toDataURL('image/jpeg', q); }
      onDone(du.slice(du.indexOf(',') + 1), 'image/jpeg', du);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

document.getElementById('tlFile').addEventListener('change', function () {
  const f = this.files && this.files[0];
  this.value = ''; // чтобы повторный выбор того же файла снова дал change
  if (!f) return;
  const prev = document.getElementById('tlPrev'), ans = document.getElementById('tlAns');
  ans.style.display = 'none'; tlSel = null;
  document.getElementById('tlBtn').style.display = 'none';
  if (f.type === 'application/pdf') {
    if (f.size > 2500000) { tlErr(t('tlush.toobig')); return; }
    const fr = new FileReader();
    fr.onerror = () => tlErr(t('tlush.badfile'));
    fr.onload = () => {
      tlSel = { b64: String(fr.result).slice(String(fr.result).indexOf(',') + 1), media: 'application/pdf' };
      prev.style.display = 'block';
