      document.getElementById('tlBtn').style.display = '';
    };
    fr.readAsDataURL(f);
    return;
  }
  // фото: декодируем с учётом EXIF-ориентации (телефон снимает «боком», canvas раньше
  // терял флаг поворота — модель получала текст вертикально), нормализуем контраст
  // серых матричных сканов, даём кнопки поворота. Инцидент 17.08.2026: гос. тлуш 12/2022,
  // снятый горизонтально, «не разбирался».
  if (/heic|heif/i.test(f.type) || /\.hei[cf]$/i.test(f.name || '')) { tlErr(t('tlush.heic')); return; }
  tlDecode(f).then(src => { tlSrc = src; tlRot = 0; tlRender0(); })
             .catch(() => tlErr(t('tlush.badfile')));
});
let tlSrc = null, tlRot = 0; // исходный кадр (canvas) и текущий поворот в градусах
function tlDecode(f) {
  // createImageBitmap с imageOrientation:'from-image' применяет EXIF-поворот сам (Chrome/WebView 81+);
  // при недоступности — обычный Image (EXIF тогда игнорируется, но кнопки поворота спасут).
  const viaBitmap = ('createImageBitmap' in window)
    ? createImageBitmap(f, { imageOrientation: 'from-image' }).catch(() => null)
    : Promise.resolve(null);
  return viaBitmap.then(bm => {
    if (bm) return bm;
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onerror = rej;
      fr.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => res(img); img.src = fr.result; };
      fr.readAsDataURL(f);
    });
  }).then(im => {
    const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
    const MAX = 1568, k = Math.min(1, MAX / Math.max(iw, ih));
    const w = Math.max(1, Math.round(iw * k)), h = Math.max(1, Math.round(ih * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(im, 0, 0, w, h);
    if (im.close) im.close();
    tlAutoContrast(ctx, w, h);
    return c;
  });
}
// Автоконтраст: серая бумага/матричная печать/тень от телефона → растягиваем яркость по
// 1-му и 99-му перцентилю. Не трогаем уже контрастные картинки (скриншоты, чистые сканы).
function tlAutoContrast(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h), p = d.data, hist = new Uint32Array(256);
  for (let i = 0; i < p.length; i += 4) hist[(p[i] * 299 + p[i + 1] * 587 + p[i + 2] * 114) / 1000 | 0]++;
  const total = w * h; let lo = 0, hi = 255, acc = 0;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= total * 0.01) { lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc >= total * 0.01) { hi = i; break; } }
  if (hi - lo > 200 || hi - lo < 25) return; // уже контрастно / почти пустой кадр
  const k = 255 / (hi - lo);
  for (let i = 0; i < p.length; i += 4) {
    p[i] = Math.max(0, Math.min(255, (p[i] - lo) * k));
    p[i + 1] = Math.max(0, Math.min(255, (p[i + 1] - lo) * k));
    p[i + 2] = Math.max(0, Math.min(255, (p[i + 2] - lo) * k));
  }
  ctx.putImageData(d, 0, 0);
}
function tlRotate(deg) { tlRot = (tlRot + deg + 360) % 360; tlRender0(); }
function tlRender0() {
  if (!tlSrc) return;
  const s = tlSrc, swap = tlRot === 90 || tlRot === 270;
  const c = document.createElement('canvas');
  c.width = swap ? s.height : s.width; c.height = swap ? s.width : s.height;
  const ctx = c.getContext('2d');
  ctx.translate(c.width / 2, c.height / 2); ctx.rotate(tlRot * Math.PI / 180);
  ctx.drawImage(s, -s.width / 2, -s.height / 2);
  let q = 0.85, du = c.toDataURL('image/jpeg', q);
  while (du.length > 2800000 && q > 0.4) { q -= 0.15; du = c.toDataURL('image/jpeg', q); }
  tlSel = { b64: du.slice(du.indexOf(',') + 1), media: 'image/jpeg' };
  const prev = document.getElementById('tlPrev');
  prev.style.display = 'block';
  prev.innerHTML = '<img src="' + du + '" alt="" style="max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--border)">' +
    '<div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">' +
    '<button type="button" class="btn ghost" style="flex:0 0 auto;padding:6px 12px" onclick="tlRotate(-90)">↺ 90°</button>' +
    '<button type="button" class="btn ghost" style="flex:0 0 auto;padding:6px 12px" onclick="tlRotate(90)">↻ 90°</button>' +
    '<span class="hint" style="margin:0">' + t('tlush.rotate.hint') + '</span></div>';
  document.getElementById('tlBtn').style.display = '';
}
function tlErr(msg) {
  const p = document.getElementById('tlPrev');
  p.style.display = 'block'; p.textContent = msg;
}

function tlushScan() {
  if (!tlSel) return;
  const ans = document.getElementById('tlAns'), btn = document.getElementById('tlBtn');
  const paid = aiUnlocked();
  const mUsed = +localStorage.getItem(tlMonthKey()) || 0;
  if (!paid && mUsed >= TL_FREE) { // бесплатная проба за месяц исчерпана → предложение подписки
    ans.style.display = 'block';
    ans.innerHTML = escT(tf('tlush.limit', {n: TL_FREE}))
      + '<br><button class="btn ghost" style="margin-top:9px;padding:9px" onclick="subOpen()">' + t('tlush.prem') + '</button>';
    return;
  }
  const used = +localStorage.getItem(aiQuotaKey()) || 0; // общий дневной лимит с онлайн-AI
  if (!paid && used >= AI_DAILY) { ans.style.display = 'block'; ans.textContent = tf('ai.online.limit', {n: AI_DAILY}); return; }
  btn.disabled = true; btn.textContent = t('tlush.wait');
  const st = tlStore();
  aiFetch({ mode: 'tlush', img: tlSel.b64, media: tlSel.media,
      prev: st.last ? st.last.f : null, lang: LANG, status: aiStatus(), // пенсионерские токены — сверка не требует БЛ/пенсию там, где их законно нет
      sector: profIndustry.value !== 'general' ? profIndustry.value : null, // отраслевая сверка (цав архава)
      tenure: +profTenure.value || null }, 180000) // повёрнутый/плотный скан у sonnet идёт до ~90 с — 120 с было впритык
    .then(d => {
      if (!d.data || typeof d.data.analysis !== 'string') throw 0;
      try { localStorage.setItem(aiQuotaKey(), used + 1); localStorage.setItem(tlMonthKey(), mUsed + 1); } catch (e) {}
      btn.disabled = false; btn.textContent = t('tlush.btn');
      statHit('tlush');
      tlRender(d.data);
      tlSave(d.data);
    })
    .catch(e => {
      btn.disabled = false; btn.textContent = t('tlush.btn');
      ans.style.display = 'block';
      // при таймауте/сбое подсказываем, ЧТО сделать с фото — раньше был только общий «попробуйте ещё раз»
      ans.innerHTML = escT(aiErrText(e)) + '<div class="note" style="margin-top:8px">' + t('tlush.retry.tips') + '</div>';
    });
}

// поля результата: 0 = текст, 1 = деньги (₪), 2 = число (часы/дни/пункты)
const TL_FIELDS = [
  ['month', 0], ['employer', 0],
  ['gross', 1], ['net', 1], ['tax', 1], ['bituach_leumi', 1],
  ['pension_employee', 1], ['pension_employer', 1], ['pitzuim', 1], ['hishtalmut', 1],
  ['nesiot', 1], ['overtime_pay', 1],
  ['hours', 2], ['hourly_rate', 1], ['vacation_balance', 2], ['sick_balance', 2], ['credit_points', 2],
];
function tlRender(d) {
  const ans = document.getElementById('tlAns');
  let rows = '';
  if (d.is_tlush) {
    TL_FIELDS.forEach(pair => {
      const v = d[pair[0]];
      if (v === null || v === undefined || v === '') return;
      const val = pair[1] === 1 ? fmt2(v) : pair[1] === 2 ? String(v) : escT(String(v));
      rows += row(t('tlush.f.' + pair[0]), val);
    });
    if (rows) rows = '<div style="margin:10px 0 2px;font-weight:650">' + t('tlush.found') + '</div>' + rows;
  }
  ans.style.display = 'block';
  // мало распознанных полей на настоящем тлуше = плохое фото (поворот/тень/мелко) — подсказываем переснять
  const filled = TL_FIELDS.filter(p => d[p[0]] !== null && d[p[0]] !== undefined && d[p[0]] !== '').length;
  const weak = d.is_tlush && filled < 6;
  ans.innerHTML = '<b>' + t('tlush.tag') + '</b><br>' + escT(d.analysis).replace(/\n/g, '<br>') + rows
    + (weak ? '<div class="note warn" style="margin-top:8px">' + t('tlush.weak') + '</div>' : '')
    + (!d.is_tlush ? '<div class="note" style="margin-top:8px">' + t('tlush.retry.tips') + '</div>' : '')
    + (d.is_tlush && d.month ? '<div class="note" style="margin-top:8px">' + t('tlush.saved') + '</div>' : '');
}
function tlSave(d) {
  if (!d.is_tlush || !d.month) return;
  const f = {};
  TL_FIELDS.forEach(pair => { f[pair[0]] = (d[pair[0]] === undefined || d[pair[0]] === '') ? null : d[pair[0]]; });
  const st = tlStore();
  st.hist = st.hist || {};
  st.hist[d.month] = { ts: Date.now(), f };
  const keys = Object.keys(st.hist); // держим максимум 14 месяцев
  if (keys.length > 14) keys.sort((a, b) => st.hist[a].ts - st.hist[b].ts).slice(0, keys.length - 14).forEach(k => delete st.hist[k]);
  st.last = { month: d.month, ts: Date.now(), f };
  try { localStorage.setItem(TL_KEY, JSON.stringify(st)); } catch (e) {}
}

function applyTheme(v) {
  if (v === 'light' || v === 'dark') document.documentElement.dataset.theme = v;
  else delete document.documentElement.dataset.theme;
}
// v1.19 (жалоба 10.08 «на крупном шрифте страница плавает и растягивается вширь»):
// body.zoom масштабирует и ширину — контейнер вылезал за экран и появлялась горизонтальная прокрутка.
// Масштабируем только текст (font-size корня), ширина остаётся по экрану.
// v1.19 (жалоба 10.08 «на крупном шрифте страница плавает и тянется вширь»): zoom масштабирует
// и ширину body — в WebView это давало горизонтальную прокрутку. Компенсируем шириной 100/k vw:
// после масштабирования получается ровно ширина экрана.
function applyFont(v) {
  const k = (v === '1' || !v) ? 1 : parseFloat(v) || 1;
  document.body.style.zoom = k === 1 ? '' : k;
  document.body.style.width = k === 1 ? '' : (100 / k) + 'vw';
  document.body.classList.toggle('zoomed', k !== 1);
}

// ======= САМОЗАНЯТЫЙ =======
function calcSelf() {
  const m = +seIncome.value || 0, pts = +sePoints.value || 0;
  const tax = incomeTax(m, pts);
  const ni = natIns(m, NI_SELF);
  const total = tax + ni;
  seSetAside.textContent = fmt(total) + (m > 0 ? ' (' + Math.round(total / m * 100) + '%)' : '');
  seBreak.innerHTML =
    row(t('self.brk.tax'), '−' + fmt(tax), 'neg') +
    row(t('self.brk.ni'), '−' + fmt(ni), 'neg') +
    row(t('self.brk.left'), fmt(m - total), 'pos');
}
// ======= Профиль самозанятого (v1.14): свои данные для некудот, независимые от вкладки «Работник» =======
// Фидбек бухгалтера 07.08.2026: самозанятый ведёт свои некудот здесь, а во вкладке «Работник»
// может параллельно считать своего наёмного работника (или себя в найме) — ничего не перетирается.
const PROF_SELF_KEY = 'heshbon_profile_self';
let seManual = false; // ручной ввод некудот отключает авторасчёт из профиля самозанятого (переживает перезапуск)
function saveSelfProf() {
  try {
    localStorage.setItem(PROF_SELF_KEY, JSON.stringify({
      st: segVal('seStatus'), g: segVal('seGender'),
      am: seAliyahM.value, ay: seAliyahY.value,
      kB: seKidsB.value, k12: seKids12.value, k3: seKids3.value,
      k45: seKids45.value, k617: seKids617.value, k18: seKids18.value, kDis: seKidsDis.value,
      kcust: seKidsCustody.checked ? 1 : 0,
      kdef: seKidsDefer.checked ? 1 : 0, kdefg: seKidsDeferGot.checked ? 1 : 0,
      ex: seExtraPts.value, exq: exSave('se'), man: seManual ? 1 : 0, pts: sePoints.value
    }));
  } catch (e) {}
}
function loadSelfProf() {
  try {
    let p = JSON.parse(localStorage.getItem(PROF_SELF_KEY) || 'null');
    // миграция v1.14: первый запуск — копируем профиль работника (DOM уже заполнен loadProf,
    // включая перенос старых форматов детских полей); дальше профили живут независимо
    if (!p) p = { st: segVal('empStatus'), g: segVal('empGender'),
      am: aliyahM.value, ay: aliyahY.value,
      kB: profKidsB.value, k12: profKids12.value, k3: profKids3.value,
      k45: profKids45.value, k617: profKids617.value, k18: profKids18.value, kDis: profKidsDis.value,
      ex: profExtraPts.value };
    if (p.st) setSegVal('seStatus', p.st);
    if (p.g) setSegVal('seGender', p.g);
    if (p.am) seAliyahM.value = p.am;
    if (p.ay) seAliyahY.value = p.ay;
    if (p.kB != null) seKidsB.value = p.kB;
    if (p.k12 != null) seKids12.value = p.k12;
    if (p.k3 != null) seKids3.value = p.k3;
    if (p.k45 != null) seKids45.value = p.k45;
    if (p.k617 != null) seKids617.value = p.k617;
    if (p.k18 != null) seKids18.value = p.k18;
    if (p.kDis != null) seKidsDis.value = p.kDis;
    if (p.kcust != null) seKidsCustody.checked = !!p.kcust;
    if (p.kdef != null) seKidsDefer.checked = !!p.kdef;
    if (p.kdefg != null) seKidsDeferGot.checked = !!p.kdefg;
    if (p.ex != null) seExtraPts.value = p.ex;
    exLoad('se', p.exq);
    seManual = !!p.man;
    if (seManual && p.pts != null) sePoints.value = p.pts;
    saveSelfProf(); // копия персистится сразу — с этого момента разделы независимы
  } catch (e) {}
}
function updSelfPoints(keepManual) {
  const st = segVal('seStatus'), g = segVal('seGender');
  if (!keepManual) seManual = false; // изменение профиля возвращает авторасчёт (как у работника)
  let base = POINTS_BASE[g], olehPts = 0, kidsPts = 0, extraPts = 0, info = '';
  document.getElementById('seOlehBlock').style.display = st === 'oleh' ? 'block' : 'none';
  if (st === 'oleh') {
    const m = monthsSinceSel(seAliyahM, seAliyahY), b = olehBonus(m);
    olehPts = b;
    if (m < 1) info = t('oleh.ask');
    else if (m > 54) info = tf('oleh.expired', {m});
    else {
      const y = +seAliyahY.value, mo = +seAliyahM.value;
      const end = new Date(y, mo - 1 + 53, 1); // 54-й льготный месяц
      info = tf('oleh.active', {m, b, base, end: String(end.getMonth() + 1).padStart(2, '0') + '.' + end.getFullYear()});
    }
  } else if (st === 'b1' || st === 's25') base = 0; // у иностранных статусов некудот нет (сиуд-исключение — только в найме)
  const hasKids = st === 'resident' || st === 'oleh';
  document.getElementById('seKidsBox').style.display = hasKids ? '' : 'none';
  if (hasKids) {
    kidsPts = kidsPtsFor(g, 'se');
    extraPts = exPoints('se', kidsPts > 0) + Math.max(0, +seExtraPts.value || 0);
  }
  const pts = base + olehPts + kidsPts + extraPts;
  document.getElementById('seOlehInfo').innerHTML = info;
  if (seManual) {
    document.getElementById('seNkAuto').textContent = t('nk.manual');
  } else {
    sePoints.value = pts;
    document.getElementById('seNkAuto').textContent = t('nk.auto');
  }
  saveSelfProf();
  calcSelf(); incRender(); // сумма «отложи» и журнал доходов читают sePoints
}
segInit('seStatus', () => updSelfPoints());
segInit('seGender', () => updSelfPoints());
['seAliyahM', 'seAliyahY'].forEach(id => document.getElementById(id).addEventListener('change', () => updSelfPoints()));
['seKidsB', 'seKids12', 'seKids3', 'seKids45', 'seKids617', 'seKids18', 'seKidsDis']
  .forEach(id => document.getElementById(id).addEventListener('input', () => updSelfPoints()));
['seKidsCustody', 'seKidsDefer', 'seKidsDeferGot']
  .forEach(id => document.getElementById(id).addEventListener('change', () => updSelfPoints()));
document.getElementById('seExtraPts').addEventListener('input', () => updSelfPoints());
document.getElementById('seExGrid').addEventListener('change', e => {
  exExclusive('se', e.target.id); // BA ↔ профдиплом: только одна из льгот
  document.getElementById('seExDemT').style.display = document.getElementById('seExDem').checked ? '' : 'none';
  updSelfPoints();
});
document.getElementById('seIncome').addEventListener('input', calcSelf);
document.getElementById('sePoints').addEventListener('input', () => {
  seManual = true; // ручной override: сохраняется и переживает перезапуск
  document.getElementById('seNkAuto').textContent = t('nk.manual');
  saveSelfProf();
  calcSelf();
});

// ======= Журнал доходов осека (локально, heshbon_income) =======
const INC_KEY = 'heshbon_income';
const incLoad = () => { try { return JSON.parse(localStorage.getItem(INC_KEY) || '[]'); } catch (e) { return []; } };
const incSave = a => { try { localStorage.setItem(INC_KEY, JSON.stringify(a)); } catch (e) {} };
function incAdd() {
  const s = +document.getElementById('incSum').value || 0;
  if (s <= 0) return;
  const a = incLoad();
  a.push({id: Date.now(), d: document.getElementById('incDate').value, s,
          c: (document.getElementById('incClient').value || '').trim()});
  incSave(a);
  document.getElementById('incSum').value = ''; document.getElementById('incClient').value = '';
  incRender();
}
function incDel(id) { incSave(incLoad().filter(e => e.id !== id)); incRender(); }
function incRender() {
  const dsel = document.getElementById('incDate'), dcur = dsel.value;
  dsel.innerHTML = '';
  for (let i = 0; i < 35; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const o = document.createElement('option');
    o.value = tbISO(d); o.textContent = tbDM(tbISO(d));
    dsel.appendChild(o);
  }
  if (dcur) dsel.value = dcur;
  if (!dsel.value) dsel.selectedIndex = 0;
  const all = incLoad();
  const msel = document.getElementById('incMonth'), mcur = msel.value;
  const months = [...new Set(all.map(e => e.d.slice(0, 7)).concat(tbISO(new Date()).slice(0, 7)))].sort().reverse();
  msel.innerHTML = '';
  months.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m.slice(5) + '.' + m.slice(0, 4); msel.appendChild(o); });
  msel.value = months.includes(mcur) ? mcur : months[0];
  const rows = all.filter(e => e.d.slice(0, 7) === msel.value).sort((x, y) => x.d < y.d ? 1 : -1);
  document.getElementById('incList').innerHTML = rows.length
    ? '<div style="margin-top:8px">' + rows.map(e =>
      '<div class="b-row"><span class="n">' + tbDM(e.d) + (e.c ? ' · ' + escT(e.c) : '') + '</span><span class="v">' + fmt(e.s) +
      ' <button type="button" class="qmark" style="border-color:var(--border);color:var(--muted)" onclick="incDel(' + e.id + ')">✕</button></span></div>').join('') + '</div>'
    : '<div class="note" style="margin-top:8px">' + t('inc.empty') + '</div>';
  // итоги месяца + «отложи на налоги сейчас» (некудот — из калькулятора выше)
  const mSum = rows.reduce((s, e) => s + e.s, 0);
  const pts = +document.getElementById('sePoints').value || 0;
  let out = '';
  if (mSum > 0) {
    const aside = Math.max(0, incomeTax(mSum, pts) + natIns(mSum, NI_SELF));
    out = '<div style="margin-top:10px">' + row(t('inc.tot.m'), fmt(mSum), 'pos') +
          row(t('inc.tot.aside'), '~' + fmt(aside), 'neg') + '</div>';
  }
  document.getElementById('incTotals').innerHTML = out;
  // прогресс к потолку осек патур за год выбранного месяца
  const yr = msel.value.slice(0, 4);
  const ySum = all.filter(e => e.d.slice(0, 4) === yr).reduce((s, e) => s + e.s, 0);
  const pct = Math.min(100, ySum / PATUR_LIMIT * 100);
  let pat = '<div style="margin-top:10px"><b>' + tf('inc.pat.h', {y: yr}) + '</b>' +
    '<div style="height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--border);margin:8px 0">' +
    '<div style="height:100%;width:' + pct.toFixed(1) + '%;border-radius:5px;background:' +
    (pct >= 90 ? 'var(--red)' : pct >= 70 ? '#eab308' : 'var(--green)') + '"></div></div>' +
    row(t('inc.pat.done'), fmt(ySum) + ' / ' + fmt(PATUR_LIMIT), pct >= 90 ? 'neg' : '');
  const now = new Date();
  if (yr === String(now.getFullYear()) && ySum > 0) {
    const dayOfYear = Math.max(1, Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000));
    const proj = ySum / dayOfYear * 365;
    if (proj > PATUR_LIMIT) {
      const cd = new Date(now.getFullYear(), 0, Math.ceil(PATUR_LIMIT / (ySum / dayOfYear)));
      pat += '<div class="note warn" style="margin-top:6px">' + tf('inc.pat.warn',
        {p: fmt(proj), m: String(cd.getMonth() + 1).padStart(2, '0') + '.' + cd.getFullYear()}) + '</div>';
    } else {
      pat += '<div class="note" style="margin-top:6px">' + tf('inc.pat.ok', {p: fmt(proj)}) + '</div>';
    }
  }
  document.getElementById('incPatur').innerHTML = pat + '</div>';
}

// ======= Журнал расходов осека: доли признания мас/маам (проверено 01.08.2026, 2+ источника) =======
// [категория, доля признания в мас hахнаса, доля вычета входного маам]. Машина 45%/⅔ (обслуживание),
// мобильный ~50%/⅔, дом.офис — доля комнаты (по умолчанию 25%, маам по жилью не вычитаем — спорная зона),
// кибуд 80% без маам, подарки до GIFT_CAP ₪/чел/год, бигуд представительский 80% (маам только с лого), аш"ль 0.
const EJ_KEY = 'heshbon_exp_journal';
const EJ_CATS = [
  ['office', 1, 1], ['materials', 1, 1], ['fees', 1, 1], ['books', 1, 1], ['insurance', 1, 1],
  ['car', .45, 2 / 3], ['phone', .5, 2 / 3], ['home', .25, 0],
  ['kibud', .8, 0], ['gifts', 1, 0], ['clothes', .8, 0], ['meals', 0, 0]
];
const ejLoad = () => { try { return JSON.parse(localStorage.getItem(EJ_KEY) || '[]'); } catch (e) { return []; } };
const ejSave = a => { try { localStorage.setItem(EJ_KEY, JSON.stringify(a)); } catch (e) {} };
const ejIsMurshe = () => localStorage.getItem('heshbon_exp_murshe') === '1';
function ejCalc(e) { // {vat: маам к вычету (только мурше), tax: признано для мас после снятия маам}
  const c = EJ_CATS.find(x => x[0] === e.cat) || ['x', 0, 0];
  const vat = ejIsMurshe() ? e.s * (VAT / (1 + VAT)) * c[2] : 0;
  return { vat, tax: (e.s - vat) * c[1] };
}
function ejAdd() {
  const s = +document.getElementById('ejSum').value || 0;
  if (s <= 0) return;
  const a = ejLoad();
  a.push({ id: Date.now(), d: document.getElementById('ejDate').value, s, cat: document.getElementById('ejCat').value });
  ejSave(a);
  document.getElementById('ejSum').value = '';
  ejRender(); zrRender();
}
function ejDel(id) { ejSave(ejLoad().filter(e => e.id !== id)); ejRender(); zrRender(); }
function ejRender() {
  const dsel = document.getElementById('ejDate'), dcur = dsel.value;
  dsel.innerHTML = '';
  for (let i = 0; i < 35; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const o = document.createElement('option'); o.value = tbISO(d); o.textContent = tbDM(tbISO(d)); dsel.appendChild(o);
  }
  if (dcur) dsel.value = dcur;
  if (!dsel.value) dsel.selectedIndex = 0;
  const csel = document.getElementById('ejCat'), ccur = csel.value;
  csel.innerHTML = '';
  EJ_CATS.forEach(c => { const o = document.createElement('option'); o.value = c[0]; o.textContent = t('ej.c.' + c[0]); csel.appendChild(o); });
  if (ccur) csel.value = ccur;
  document.getElementById('ejMurshe').checked = ejIsMurshe();
  const all = ejLoad();
  const msel = document.getElementById('ejMonth'), mcur = msel.value;
  const months = [...new Set(all.map(e => e.d.slice(0, 7)).concat(tbISO(new Date()).slice(0, 7)))].sort().reverse();
  msel.innerHTML = '';
  months.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m.slice(5) + '.' + m.slice(0, 4); msel.appendChild(o); });
  msel.value = months.includes(mcur) ? mcur : months[0];
  const rows = all.filter(e => e.d.slice(0, 7) === msel.value).sort((x, y) => x.d < y.d ? 1 : -1);
  document.getElementById('ejList').innerHTML = rows.length
    ? '<div style="margin-top:8px">' + rows.map(e =>
      '<div class="b-row"><span class="n">' + tbDM(e.d) + ' · ' + t('ej.c.' + e.cat) + '</span><span class="v">' + fmt(e.s) +
      ' <button type="button" class="qmark" style="border-color:var(--border);color:var(--muted)" onclick="ejDel(' + e.id + ')">✕</button></span></div>').join('') + '</div>'
    : '<div class="note" style="margin-top:8px">' + t('ej.empty') + '</div>';
  let out = '';
  if (rows.length) {
    const spent = rows.reduce((s, e) => s + e.s, 0);
    const tax = rows.reduce((s, e) => s + ejCalc(e).tax, 0);
    const vat = rows.reduce((s, e) => s + ejCalc(e).vat, 0);
    out = '<div style="margin-top:10px">' + row(t('ej.tot.spent'), fmt(spent)) +
      row(t('ej.tot.tax'), fmt(tax), 'pos') +
      (ejIsMurshe() ? row(t('ej.tot.vat'), fmt(vat), 'pos') : '') + '</div>';
    const yr = msel.value.slice(0, 4);
    const yTax = all.filter(e => e.d.slice(0, 4) === yr).reduce((s, e) => s + ejCalc(e).tax, 0);
    const yVat = all.filter(e => e.d.slice(0, 4) === yr).reduce((s, e) => s + ejCalc(e).vat, 0);
    out += '<div class="note" style="margin-top:6px">' + tf('ej.tot.y', { y: yr, t: fmt(yTax), v: fmt(yVat) }) + '</div>';
  }
  document.getElementById('ejTotals').innerHTML = out;
}
function ejCsv(btn) {
  const mon = document.getElementById('ejMonth').value;
  const rows = ejLoad().filter(e => e.d.slice(0, 7) === mon).sort((x, y) => x.d > y.d ? 1 : -1);
  const text = 'date,category,sum,recognized_tax,vat_deductible\n' + rows.map(e => {
    const c = ejCalc(e);
    return [e.d, e.cat, e.s, c.tax.toFixed(2), c.vat.toFixed(2)].join(',');
  }).join('\n') + '\nTOTAL,,' + rows.reduce((s, e) => s + e.s, 0) + ',' +
    rows.reduce((s, e) => s + ejCalc(e).tax, 0).toFixed(2) + ',' +
    rows.reduce((s, e) => s + ejCalc(e).vat, 0).toFixed(2) + '\n';
  if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); btn.textContent = t('tb.exported'); } catch (e) {}
  ta.remove();
}

// ======= Осек заир (реформа 2024): реальные признанные расходы vs нормативные 30% =======
function zrRender() {
  const box = document.getElementById('zrOut');
  const yr = String(new Date().getFullYear());
  const inc = incLoad().filter(e => e.d.slice(0, 4) === yr).reduce((s, e) => s + e.s, 0);
  if (!inc) { box.innerHTML = '<div class="note">' + t('zr.empty') + '</div>'; return; }
  const real = ejLoad().filter(e => e.d.slice(0, 4) === yr).reduce((s, e) => s + ejCalc(e).tax, 0);
  const norm = inc * ZAIR_PCT;
  const d = norm - real;
  let verdict;
  if (inc > PATUR_LIMIT) verdict = '<div class="note warn" style="margin-top:6px">' + tf('zr.over', { c: fmt(PATUR_LIMIT) }) + '</div>';
  else if (Math.abs(d) < inc * .03) verdict = '<div class="note" style="margin-top:6px">' + tf('zr.close', { d: fmt(Math.abs(d)) }) + '</div>';
  else if (d > 0) verdict = '<div class="note" style="margin-top:6px;border-color:var(--green)">' + tf('zr.better.norm', { d: fmt(d) }) + '</div>';
  else verdict = '<div class="note" style="margin-top:6px">' + tf('zr.better.real', { d: fmt(-d) }) + '</div>';
  box.innerHTML = row(tf('zr.turn', { y: yr }), fmt(inc)) +
    row(t('zr.real'), fmt(real)) + row(t('zr.norm'), fmt(norm), 'pos') + verdict;
}

// ======= Сверка заявленной в БЛ базы с реальным доходом (дмей пгия считают по микдамот!) =======
function blmRender() {
  const base = +document.getElementById('blmBase').value || 0;
  try { localStorage.setItem('heshbon_blm', base ? String(base) : ''); } catch (e) {}
  const box = document.getElementById('blmOut');
  const now = new Date(), yr = String(now.getFullYear());
  const ySum = incLoad().filter(e => e.d.slice(0, 4) === yr).reduce((s, e) => s + e.s, 0);
  const avg = ySum / (now.getMonth() + 1);
  if (!base || !ySum) { box.innerHTML = '<div class="note" style="margin-top:8px">' + t('blm.empty') + '</div>'; return; }
  const p = Math.round((avg - base) / base * 100);
  let msg;
  if (Math.abs(p) < 10) msg = '<div class="note" style="margin-top:6px;border-color:var(--green)">' + t('blm.ok') + '</div>';
  else if (p > 0) msg = '<div class="note warn" style="margin-top:6px">' + tf('blm.up', { p, b: fmt(base) }) + '</div>';
  else msg = '<div class="note" style="margin-top:6px">' + tf('blm.down', { p: -p }) + '</div>';
  box.innerHTML = '<div style="margin-top:8px">' + row(tf('blm.avg', { y: yr }), fmt(avg)) + '</div>' + msg;
}
document.getElementById('blmBase').addEventListener('input', blmRender);
(() => { const b = localStorage.getItem('heshbon_blm'); if (b) document.getElementById('blmBase').value = b; })();

// ======= Проверка входящего хешбонита: реестр мурше, миспар акцаа, наличные =======
function ivcRender() {
  const s = +document.getElementById('ivcSum').value || 0;
  const cash = document.getElementById('ivcCash').checked;
  const box = document.getElementById('ivcOut');
  if (!s) { box.innerHTML = ''; return; }
  const net = s / (1 + VAT);
  const li = (html, warn) => '<div class="note' + (warn ? ' warn' : '') + '" style="margin-top:6px">' + html + '</div>';
  let html = li(t('ivc.i.sup') + ' <a href="https://taxinfo.taxes.gov.il/emosek" target="_blank" rel="noopener">taxinfo.taxes.gov.il/emosek</a>');

// ======= «Хочу чистыми X» — обратное ценообразование ацмаи =======
function selfPensMand(m) { // обязательная пенсия ацмаи, ₪/мес
  return Math.min(Math.min(m, SP_LOW_CAP) * SP_LOW + Math.max(0, m - SP_LOW_CAP) * SP_HIGH, SP_MAX);
}
function selfNet(g, pts, pens) {
  return g - incomeTax(g, pts) - natIns(g, NI_SELF) - (pens ? selfPensMand(g) : 0);
}
function calcPrice() {
  const want = +document.getElementById('prWant').value || 0;
  const pts = +document.getElementById('prPts').value || 0;
  const pens = document.getElementById('prPens').checked;
  if (!want) { document.getElementById('prOut').textContent = '—'; document.getElementById('prBreak').innerHTML = ''; return; }
  let lo = want, hi = want * 2.5 + 3000;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (selfNet(mid, pts, pens) < want) lo = mid; else hi = mid; }
  const g = Math.ceil(hi);
  const tax = incomeTax(g, pts), ni = natIns(g, NI_SELF), pn = pens ? selfPensMand(g) : 0;
  document.getElementById('prOut').textContent = fmt(g);
  document.getElementById('prBreak').innerHTML =
    row(t('pr.b.tax'), '−' + fmt(tax)) + row(t('pr.b.ni'), '−' + fmt(ni)) +
    (pens ? row(t('pr.b.pens'), '−' + fmt(pn)) : '') +
    row(t('pr.b.net'), fmt(g - tax - ni - pn), 'pos') +
    row(t('pr.b.vat'), '+' + fmt(g * VAT));
}
['prWant','prPts'].forEach(id => document.getElementById(id).addEventListener('input', calcPrice));
document.getElementById('prPens').addEventListener('change', calcPrice);

// ======= Пенсия и иштальмут ацмаи =======
function calcSelfPens() {
  const m = +document.getElementById('spInc').value || 0;
  const pens = selfPensMand(m);
  const hishRec = Math.min(m * 12 * HISH_SELF_PCT, HISH_SELF_CAP);
  document.getElementById('spOut').innerHTML = m ?
    row(t('sp.b.pens'), fmt(pens) + t('sp.mo'), 'neg') +
    row(t('sp.b.pensy'), fmt(pens * 12) + t('sp.yr')) +
    row(t('sp.b.hish'), fmt(hishRec) + t('sp.yr'), 'pos') +
    row(t('sp.b.hishmax'), fmt(HISH_SELF_FREE) + t('sp.yr')) : '';
}

function renderDeadlines() {
  const now = new Date();
  const mk = (d, m, y) => new Date(y, m, d);
  const nextDay = day => {
    let d = mk(day, now.getMonth(), now.getFullYear());
    if (d < now) d = mk(day, now.getMonth() + 1, now.getFullYear());
    return d;
  };
  const nextAnnual = (day, mon) => { // ближайшая годовая дата (mon 0-based)
    let d = mk(day, mon, now.getFullYear());
    if (d < now) d = mk(day, mon, now.getFullYear() + 1);
    return d;
  };
  const items = [
    { d: nextDay(15), tt: t('dl.vat.t'), s: t('dl.vat.s') },
    { d: nextDay(15), tt: t('dl.mik.t'), s: t('dl.mik.s') },
    { d: nextDay(15), tt: t('dl.btl.t'), s: t('dl.btl.s') },
    { d: nextAnnual(31, 0), tt: t('dl.pat.t'), s: tf('dl.pat.s', {f: fmt(PATUR_FINE)}) },
    { d: mk(31, 4, now.getMonth() > 4 ? now.getFullYear() + 1 : now.getFullYear()), tt: t('dl.year.t'), s: t('dl.year.s') },
    { d: nextAnnual(31, 11), tt: t('dl.pens.t'), s: tf('dl.pens.s', {f: fmt(PENS_FINE)}) },
  ].sort((a, b) => a.d - b.d);
  const MON = t('months');
  seDeadlines.innerHTML = items.map(i =>
    `<div class="deadline"><div class="day">${i.d.getDate()}<small>${MON[i.d.getMonth()]}</small></div>
     <div class="info"><b>${i.tt}</b><span>${i.s}</span></div></div>`).join('');
}

// ======= Движок нетто (расчёт работника; база для будущего нетто→брутто) =======
function netOf(gross, pts, pen, ni) { // ni — необязательные ставки БЛ работника (по умолчанию обычный резидент)
  return gross - incomeTax(gross, pts) - natIns(gross, ni || NI_EMP) - (pen ? gross * PENSION_EMP : 0);

// ======= Сворачиваемые карточки (v1.15.1): второстепенные закрыты, интерфейс дышит =======
const FOLDS_KEY = 'heshbon_folds';
function cardFoldKey(card) {
  const h = card.querySelector(':scope > h3');
  if (!h) return null;
  const el = h.matches('[data-i18n]') ? h : h.querySelector('[data-i18n]');
  return el ? el.dataset.i18n : null;
}
function unfoldCard(el) { // программное открытие (переходы вроде «сверка → письмо»)
  const card = el && el.closest ? el.closest('.card') : null;
  if (card) card.classList.remove('folded');
}
(function initFolds() {
  let st = {};
  try { st = JSON.parse(localStorage.getItem(FOLDS_KEY) || '{}'); } catch (e) {}
  document.querySelectorAll('.card.fold').forEach(card => {
    const key = cardFoldKey(card);
    if (!key) return;
    card.classList.add('foldable');
    card.classList.toggle('folded', st[key] !== 1); // по умолчанию свёрнута; 1 = пользователь оставил открытой
    card.querySelector(':scope > h3').addEventListener('click', e => {
      if (e.target.closest('button, a, input, select, .qmark')) return; // клики по контролам в заголовке — не тумблер
      const folded = card.classList.toggle('folded');
      st[key] = folded ? 0 : 1;
      try { localStorage.setItem(FOLDS_KEY, JSON.stringify(st)); } catch (e2) {}
    });
  });
})();

// ======= Автообновление ставок: сперва хостинг (GitHub Pages), затем локальный фолбэк =======
const RATES_URLS = ['https://heshbonplus.com/rates.json', 'https://dimollia-lang.github.io/heshbon-plus/rates.json', 'rates.json'];
function showRates() {
  if (ratesVer) document.getElementById('ratesInfo').textContent = tf('rates.online', {v: ratesVer});
}
function fetchRates(i) {
  i = i || 0;
  if (i >= RATES_URLS.length) return;
  fetch(RATES_URLS[i], {cache: 'no-store'}).then(r => r.ok ? r.json() : Promise.reject(0)).then(d => {
    if (!d || !d.version) return;
    if (d.brackets) BRACKETS = d.brackets.map(b => [b[0] == null ? Infinity : b[0], b[1]]); // JSON не знает Infinity
    POINT = d.point || POINT; NI_T = d.ni_t || NI_T; NI_CAP = d.ni_cap || NI_CAP;
    NI_EMP = d.ni_emp || NI_EMP; NI_B1 = d.ni_b1 || NI_B1; NI_SELF = d.ni_self || NI_SELF; NI_ER = d.ni_er || NI_ER;
    PENSION_EMP = d.pension_emp || PENSION_EMP; PENSION_ER = d.pension_er || PENSION_ER; PITZUIM = d.pitzuim || PITZUIM;
    VAT = d.vat || VAT; MIN_HOUR = d.min_hour || MIN_HOUR; HAVRAA_DAY = d.havraa_day || HAVRAA_DAY; HAVRAA_CLEAN = d.havraa_clean || HAVRAA_CLEAN; HAVRAA_PUB = d.havraa_pub || HAVRAA_PUB; CLEAN_HOUR = d.cleaning_hour || CLEAN_HOUR; SEC_HOUR = d.security_hour || SEC_HOUR; PATUR_LIMIT = d.patur_limit || PATUR_LIMIT;
    SP_LOW = d.sp_low || SP_LOW; SP_HIGH = d.sp_high || SP_HIGH; SP_LOW_CAP = d.sp_low_cap || SP_LOW_CAP; SP_MAX = d.sp_max || SP_MAX;
    HISH_SELF_PCT = d.hish_self_pct || HISH_SELF_PCT; HISH_SELF_CAP = d.hish_self_cap || HISH_SELF_CAP; HISH_SELF_FREE = d.hish_self_free || HISH_SELF_FREE;
    ALLOC_TH = d.alloc_th || ALLOC_TH; CASH_BIZ = d.cash_biz || CASH_BIZ; CASH_PRIV = d.cash_priv || CASH_PRIV; GIFT_CAP = d.gift_cap || GIFT_CAP;
    PATUR_FINE = d.patur_fine || PATUR_FINE; PENS_FINE = d.pens_fine || PENS_FINE; ZAIR_PCT = d.zair_pct || ZAIR_PCT;
    ratesVer = d.version;
    calcEmp(); calcSelf(); calcOT(); calcFired(); showRates();
    ejRender(); zrRender(); blmRender(); ivcRender(); calcSelfPens();
  }).catch(() => fetchRates(i + 1)); // следующий источник; все недоступны — работаем на вшитых
}
